<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FriendlyChat">
<title>FriendlyChat</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --field:#efeff2; --line:#e6e6ea; --hover:#f4f4f6;
  --text:#0b0b0f; --muted:#737380; --accent:#4c5bf5; --accent-ink:#fff; --accent-soft:#e9ebff;
  --mine:#4c5bf5; --mine-ink:#fff; --theirs:#efeff2; --danger:#e5484d; --ok:#1a9a5a;
  --ring:linear-gradient(45deg,#f9a13b,#ee2a7b,#6228d7);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --panel:#000000; --field:#1f1f24; --line:#26262c; --hover:#121216;
    --text:#f5f5f7; --muted:#9a9aa6; --accent:#6b78ff; --accent-soft:#1d2050;
    --mine:#5563f7; --theirs:#232329; --danger:#ff6369;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg{display:block}

/* ---------- Auth ---------- */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px;padding:8px 6px}
.brand{font-weight:800;font-size:30px;letter-spacing:-.02em;text-align:center;margin-bottom:6px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo-mark{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
@media (prefers-color-scheme: dark){.logo-mark{border-radius:22%;box-shadow:0 0 0 1px #34343c;filter:none}}
.auth-sub{color:var(--muted);margin:0 0 22px;text-align:center}
.tabs{display:flex;background:var(--field);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.inp{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:12px;background:var(--field);outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:none;line-height:1.4}
.hint{font-size:12px;color:var(--muted);margin-top:5px;min-height:16px}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-soft{background:var(--field);color:var(--text)}
.btn-block{width:100%;margin-top:18px}
.btn-sm{padding:7px 14px;border-radius:10px;font-size:14px}
.btn-link{color:var(--accent);font-weight:600}
.btn-danger{color:var(--danger);font-weight:600}
.msg-box{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:14px}
.msg-box.err{background:rgba(229,72,77,.12);color:var(--danger)}
.msg-box.info{background:var(--accent-soft);color:var(--text)}
.link-row{text-align:center;margin-top:14px}

/* ---------- Layout ---------- */
#app{height:100dvh;display:flex}
aside{width:400px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;padding-top:max(12px,env(safe-area-inset-top))}
.top .uname{flex:1;text-align:center;font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:26px;height:26px}
.search-pill{margin:6px 16px 4px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:14px;padding:0 12px}
.search-pill svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search-pill input{flex:1;border:0;background:none;outline:none;padding:11px 0;min-width:0}
.search-pill .clear{color:var(--muted);font-size:13px;font-weight:600}
.scroll{flex:1;overflow-y:auto;min-height:0}

/* friends row */
.friends-row{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
.friends-row::-webkit-scrollbar{display:none}
.friend{width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.friend .nm{font-size:12px;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{padding:3px;border-radius:50%;background:transparent}
.ring.on{background:var(--ring)}
.ring > div{border:2px solid var(--panel)}
.add-circle{width:66px;height:66px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--text);margin:3px}
.add-circle svg{width:26px;height:26px}

/* tabs */
.tabbar{display:flex;align-items:center;gap:8px;padding:6px 16px 8px}
.pill{padding:7px 14px;border-radius:999px;background:var(--field);font-weight:600;font-size:14px;color:var(--text)}
.pill.on{background:var(--text);color:var(--bg)}
.tabbar .sp{flex:1}
.req-link{font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.req-link.has{color:var(--accent)}
.badge{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:inline-grid;place-items:center}

/* conversations */
.conv{display:flex;gap:12px;align-items:center;padding:9px 16px;width:100%;text-align:left}
.conv:hover{background:var(--hover)}
.conv.on{background:var(--hover)}
.conv-body{flex:1;min-width:0}
.conv-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-sub{display:flex;font-size:14px;color:var(--muted);margin-top:1px;min-width:0}
.conv-sub .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.conv-sub .w{white-space:nowrap;flex-shrink:0}
.conv.unread .conv-name{font-weight:700}
.conv.unread .conv-sub{color:var(--text);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0}
.empty{padding:34px 24px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.sect{font-weight:700;font-size:15px;padding:14px 16px 6px}

/* avatars */
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0;font-size:19px;text-transform:uppercase;overflow:hidden}
.avatar{position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--field)}
.avatar.lg{width:66px;height:66px;font-size:22px}
.avatar.xl{width:92px;height:92px;font-size:32px}
.avatar.xxl{width:136px;height:136px;font-size:46px}
.avatar.me{width:38px;height:38px;font-size:14px}
#profileBtn{width:46px;height:46px;border-radius:50%}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.xs{width:30px;height:30px;font-size:12px}
.stack{position:relative;width:56px;height:56px;flex-shrink:0}
.stack .avatar{width:40px;height:40px;font-size:14px;position:absolute;border:2px solid var(--panel)}
.stack .avatar:first-child{top:0;left:0}
.stack .avatar:last-child{bottom:0;right:0}
.stack.sm{width:36px;height:36px}
.stack.sm .avatar{width:26px;height:26px;font-size:10px}

/* people rows */
.person{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
.person:hover{background:var(--hover)}
.person .n{flex:1;min-width:0}
.person .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .n span{font-size:13px;color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.person.sel .check{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;gap:6px;flex-shrink:0}

/* chat */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.placeholder .big{width:88px;height:88px;border-radius:50%;border:2px solid var(--text);display:grid;place-items:center;margin:0 auto 14px;color:var(--text)}
.placeholder .big svg{width:40px;height:40px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.chat-head .t{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px}
.chat-head .t .tt{min-width:0}
.chat-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.chat-head .t span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}
.messages{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column}
.day{align-self:center;font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.row{display:flex;flex-direction:column;max-width:75%;margin-top:2px}
.row.mine{align-self:flex-end;align-items:flex-end}
.row.theirs{align-self:flex-start;align-items:flex-start}
.row.first{margin-top:10px}
.sender{font-size:12px;color:var(--muted);margin:0 0 3px 12px}
.bubble{padding:9px 13px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere}
.row.mine .bubble{background:var(--mine);color:var(--mine-ink)}
.row.theirs .bubble{background:var(--theirs)}
.row.mine:not(.last) .bubble{border-bottom-right-radius:6px}
.row.mine:not(.first) .bubble{border-top-right-radius:6px}
.row.theirs:not(.last) .bubble{border-bottom-left-radius:6px}
.row.theirs:not(.first) .bubble{border-top-left-radius:6px}
.bubble a{color:inherit;text-decoration:underline}
.stamp{font-size:11px;color:var(--muted);margin:3px 8px 0}
.older{align-self:center;margin-bottom:6px;font-size:13px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.composer .box{flex:1;display:flex;align-items:flex-end;background:var(--field);border-radius:24px;padding:4px 4px 4px 16px}
.composer textarea{flex:1;resize:none;max-height:140px;border:0;background:none;outline:none;line-height:1.35;padding:8px 0}
.send{height:36px;padding:0 14px;border-radius:18px;color:var(--accent);font-weight:700}
.send:disabled{opacity:.35;cursor:default}
.chat-intro{text-align:center;padding:24px 10px 8px}
.chat-intro b{display:block;font-size:18px;margin-top:10px}
.chat-intro span{color:var(--muted);font-size:14px}
.chat-intro .bio{display:block;margin:6px auto 0;max-width:320px;color:var(--text);white-space:pre-wrap}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{width:100%;max-width:440px;max-height:86dvh;background:var(--panel);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;padding:12px 10px 8px 18px}
.sheet-head h2{font-size:17px;margin:0;flex:1;text-align:center;padding-left:40px}
.sheet-body{overflow-y:auto;padding-bottom:16px}
.sheet-pad{padding:0 16px}
.sheet-foot{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.chip{background:var(--accent-soft);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1}
.role{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.profile-card{text-align:center;padding:4px 16px 8px}
.profile-card .avatar{margin:0 auto}
.profile-card h3{margin:12px 0 2px;font-size:20px}
.profile-card .u{color:var(--muted)}
.profile-card .bio{margin:10px auto 0;max-width:340px;white-space:pre-wrap;overflow-wrap:anywhere}
.profile-card .btns{display:flex;gap:8px;margin-top:18px}
.profile-card .btns .btn{flex:1}
.photo-edit{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 16px 4px}
.photo-edit .pic{position:relative}
.photo-edit .cam{position:absolute;right:2px;bottom:2px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:3px solid var(--panel)}
.photo-edit .cam svg{width:19px;height:19px}
.avatar.zoomable{cursor:zoom-in}

/* photo viewer */
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.viewer img{width:min(86vw,420px);height:min(86vw,420px);border-radius:50%;object-fit:cover}

/* cropper (Instagram-style move & scale) */
.crop{position:fixed;inset:0;z-index:65;background:#000;color:#fff;display:flex;flex-direction:column}
.crop-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.crop-head b{font-size:17px}
.crop-head button{font-weight:600;padding:6px 4px}
.crop-head .done{color:#7d88ff}
.crop-stage{flex:1;display:grid;place-items:center;min-height:0}
.crop-box{position:relative;width:min(92vw,62dvh,440px);aspect-ratio:1;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.crop-box:active{cursor:grabbing}
.crop-box img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.6);pointer-events:none;outline:1px solid rgba(255,255,255,.7);outline-offset:-1px}
.crop-grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px) calc(66.66% + .5px),transparent 0),
             linear-gradient(0deg,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px) calc(66.66% + .5px),transparent 0)}
.crop-box.moving .crop-grid{opacity:1}
.crop-foot{padding:16px 24px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.crop-foot .hint{color:#a8a8b3;margin:0}
.zoom-row{display:flex;align-items:center;gap:12px;width:100%;max-width:360px}
.zoom-row svg{width:20px;height:20px;flex-shrink:0;color:#ccc}
.zoom-row input{flex:1;accent-color:#7d88ff}
.photo-edit .links{display:flex;gap:16px;font-size:14px}
.photo-edit.busy .pic{opacity:.5}
.counter{float:right;font-weight:400;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}

@media (max-width:760px){
  aside{width:100%;border-right:0}
  main{display:none}
  #app.show-chat aside{display:none}
  #app.show-chat main{display:flex}
  .back{display:grid}
  .row{max-width:82%}
  .overlay{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:20px 20px 0 0;max-height:92dvh;border:0}
}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<section id="auth" class="hidden">
  <div class="auth-card">
    <div class="brand"><svg class="logo-mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#000"/>
  <defs>
    <path id="bubble" d="M156 128 H356 A56 56 0 0 1 412 184 V288 A56 56 0 0 1 356 344 H214 L138 404 L152 344 A56 56 0 0 1 100 288 V184 A56 56 0 0 1 156 128 Z"/>
  </defs>
  <use href="#bubble" fill="#E8338A" transform="translate(16 16)"/>
  <use href="#bubble" fill="#FFF35C"/>
  <path transform="translate(236 268) rotate(37.1)"
        d="M14 -280 L64 -280 L30 -150 L78 -150 L0 0 L10 -118 L-40 -118 Z"
        fill="#FFF35C" stroke="#000" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill"/>
</svg>FriendlyChat</div>
    <p class="auth-sub">Μίλα με τους φίλους σου, ένας-προς-έναν ή σε ομάδες.</p>
    <div class="tabs" id="authTabs">
      <button data-tab="login" class="on">Σύνδεση</button>
      <button data-tab="signup">Εγγραφή</button>
    </div>

    <form id="loginForm" autocomplete="on">
      <label class="f" for="liEmail">Email</label>
      <input class="inp" id="liEmail" type="email" autocomplete="email" required>
      <label class="f" for="liPass">Κωδικός</label>
      <input class="inp" id="liPass" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block" type="submit">Σύνδεση</button>
      <div class="link-row"><button type="button" class="btn-link" id="forgotBtn">Ξέχασα τον κωδικό μου</button></div>
    </form>

    <form id="signupForm" class="hidden" autocomplete="on">
      <label class="f" for="suUser">Όνομα χρήστη</label>
      <input class="inp" id="suUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required placeholder="π.χ. stathis_93">
      <div class="hint" id="userHint">Λατινικά γράμματα, αριθμοί και _ (3 έως 24 χαρακτήρες)</div>
      <label class="f" for="suEmail">Email</label>
      <input class="inp" id="suEmail" type="email" autocomplete="email" required>
      <label class="f" for="suPass">Κωδικός</label>
      <input class="inp" id="suPass" type="password" autocomplete="new-password" minlength="6" required>
      <div class="hint">Τουλάχιστον 6 χαρακτήρες</div>
      <button class="btn btn-primary btn-block" type="submit" id="signupBtn">Δημιουργία λογαριασμού</button>
    </form>

    <form id="resetForm" class="hidden">
      <p class="auth-sub" style="margin:0">Βάλε νέο κωδικό για τον λογαριασμό σου.</p>
      <label class="f" for="newPass">Νέος κωδικός</label>
      <input class="inp" id="newPass" type="password" autocomplete="new-password" minlength="6" required>
      <button class="btn btn-primary btn-block" type="submit">Αποθήκευση</button>
    </form>

    <div id="authMsg" class="msg-box hidden"></div>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <aside>
    <div class="top">
      <button class="icon-btn" id="profileBtn" aria-label="Το προφίλ μου"><div id="meAvatar"></div></button>
      <div class="uname" id="meName"></div>
      <button class="icon-btn" id="composeBtn" aria-label="Νέο μήνυμα">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8 8 16l1.2-4Z"/></svg>
      </button>
    </div>
    <div class="search-pill">

<script>
/* ================= CONFIG ================= */

const USERNAME_RE = /^[a-z0-9_]{3,24}$/;

const state = {

/* ================= HELPERS ================= */
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');}
const COLORS=['#4c5bf5','#0e9f6e','#e0662f','#c2417c','#2b7bd8','#8a4fd6','#d19a0b','#138a99','#d6455d'];
function colorFor(key){let h=0;for(const c of String(key))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];}
function initials(name){const p=String(name||'?').trim().split(/[\s_]+/).filter(Boolean);return ((p[0]?.[0]||'?')+(p[1]?.[0]||'')).toUpperCase();}
function safeAvatar(url){return typeof url==='string'&&url.startsWith(SUPABASE_URL+'/storage/v1/object/public/avatars/')?url:null;}
function av(name,key,size='',url=null){
  const u=safeAvatar(url);
  // initials stay underneath; if the photo fails to load it just disappears
  if(u)return `<div class="avatar ${size}" style="background:${colorFor(key)}">${esc(initials(name))}<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  return `<div class="avatar ${size}" style="background:${colorFor(key)}">${esc(initials(name))}</div>`;
}
// avatar from a profile object (uses photo when there is one)
function avP(p,size='',fallbackKey='x'){return av(nameOf(p),p?.id||fallbackKey,size,p?.avatar_url);}
function nameOf(p){return p?(p.display_name||p.username):'Διαγραμμένος χρήστης';}
function firstName(p){return nameOf(p).split(' ')[0];}
function fmtTime(d){return new Date(d).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});}
function sameDay(a,b){return new Date(a).toDateString()===new Date(b).toDateString();}
function fmtDay(d){
  const x=new Date(d),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(sameDay(x,t))return 'Σήμερα';if(sameDay(x,y))return 'Χθες';
  return x.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'});
}
function rel(d){
  const s=Math.max(0,(Date.now()-new Date(d))/1000);
  if(s<60)return 'τώρα';
  const m=Math.floor(s/60);if(m<60)return m+' λεπ.';
  const h=Math.floor(m/60);if(h<24)return h+' ώρ.';
  const dd=Math.floor(h/24);if(dd<7)return dd+' ημ.';
  return Math.floor(dd/7)+' εβδ.';
}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2800);}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function others(c){return (c.members||[]).filter(m=>m.id!==state.me.id);}
function convTitle(c){
  if(c.is_group)return c.name||'Ομάδα';
  return nameOf(others(c)[0]);
}
function convAvatar(c,small=false){
  if(c.is_group){
    const o=others(c);const a=o[0]||state.me,b=o[1]||state.me;
    return `<div class="stack${small?' sm':''}">${avP(a)}${avP(b)}</div>`;
  }
  const o=others(c)[0];
  return avP(o,small?'sm':'',c.id);
}
function relation(uid){
  if(state.friends.some(f=>f.id===uid))return 'friends';
  if(state.outgoing.some(p=>p.id===uid))return 'outgoing';
  if(state.incoming.some(p=>p.id===uid))return 'incoming';
  return 'none';
}
const ICON_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>';

/* ================= AUTH ================= */
function showAuthMsg(t,type='err'){const b=$('authMsg');b.textContent=t;b.className='msg-box '+type;}
function hideAuthMsg(){$('authMsg').className='msg-box hidden';}
function setTab(tab){
  document.querySelectorAll('#authTabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('loginForm').classList.toggle('hidden',tab!=='login');
  $('signupForm').classList.toggle('hidden',tab!=='signup');
  $('resetForm').classList.add('hidden');$('authTabs').classList.remove('hidden');hideAuthMsg();
}
document.querySelectorAll('#authTabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

const checkUsername=debounce(async(v)=>{
  const hint=$('userHint');
  if(!USERNAME_RE.test(v)){hint.className='hint bad';hint.textContent=v.length<3?'Τουλάχιστον 3 χαρακτήρες':'Μόνο λατινικά γράμματα, αριθμοί και _';return;}
  const {data,error}=await sb.rpc('username_available',{u:v});
  if($('suUser').value.trim().toLowerCase()!==v)return;
  if(error){hint.className='hint';hint.textContent='';return;}
  hint.className='hint '+(data?'ok':'bad');hint.textContent=data?'✓ Διαθέσιμο':'Το όνομα χρησιμοποιείται ήδη';
},350);
$('suUser').addEventListener('input',e=>{
  const clean=e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(clean!==e.target.value)e.target.value=clean;
  $('userHint').className='hint';$('userHint').textContent='Έλεγχος…';checkUsername(clean);
});
$('signupForm').addEventListener('submit',async e=>{
  e.preventDefault();hideAuthMsg();
  const username=$('suUser').value.trim().toLowerCase(),email=$('suEmail').value.trim(),password=$('suPass').value;
  if(!USERNAME_RE.test(username))return showAuthMsg('Το όνομα χρήστη δεν είναι έγκυρο.');
  if(password.length<6)return showAuthMsg('Ο κωδικός θέλει τουλάχιστον 6 χαρακτήρες.');
  const {data:free}=await sb.rpc('username_available',{u:username});
  if(free===false)return showAuthMsg('Το όνομα χρήστη χρησιμοποιείται ήδη. Διάλεξε άλλο.');
  $('signupBtn').disabled=true;
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{username},emailRedirectTo:location.origin+location.pathname}});
  $('signupBtn').disabled=false;
  if(error){
    const m=error.message||'';
    if(/already registered|already exists/i.test(m))return showAuthMsg('Υπάρχει ήδη λογαριασμός με αυτό το email.');
    if(/database error/i.test(m))return showAuthMsg('Το όνομα χρήστη πιάστηκε μόλις τώρα. Διάλεξε άλλο.');
    if(/rate limit/i.test(m))return showAuthMsg('Πολλές εγγραφές μαζί. Δοκίμασε ξανά σε λίγο.');
    return showAuthMsg('Κάτι πήγε στραβά: '+m);
  }
  if(data?.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return showAuthMsg('Υπάρχει ήδη λογαριασμός με αυτό το email.');
  if(!data.session){
    $('signupForm').reset();$('userHint').className='hint';$('userHint').textContent='';
    setTab('login');showAuthMsg('Σου στείλαμε email επιβεβαίωσης. Πάτα τον σύνδεσμο (κοίτα και στα spam) και μετά συνδέσου.','info');
  }
});
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();hideAuthMsg();
  const {error}=await sb.auth.signInWithPassword({email:$('liEmail').value.trim(),password:$('liPass').value});
  if(error){
    const m=error.message||'';
    if(/invalid login/i.test(m))return showAuthMsg('Λάθος email ή κωδικός.');
    if(/not confirmed/i.test(m))return showAuthMsg('Δεν έχεις επιβεβαιώσει ακόμα το email σου. Δες τα εισερχόμενα (και τα spam).');
    return showAuthMsg(m);
  }
});
$('forgotBtn').onclick=async()=>{
  const email=$('liEmail').value.trim();
  if(!email)return showAuthMsg('Γράψε πρώτα το email σου στο πεδίο από πάνω.');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)return showAuthMsg(error.message);
  showAuthMsg('Αν υπάρχει λογαριασμός, θα λάβεις email για νέο κωδικό.','info');
};
$('resetForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const {error}=await sb.auth.updateUser({password:$('newPass').value});
  if(error)return showAuthMsg(error.message);
  toast('Ο κωδικός άλλαξε');enterApp();
});

/* ================= SESSION ================= */
let entering=false;
async function enterApp(){
  if(entering)return;entering=true;
  const {data:{user}}=await sb.auth.getUser();
  if(!user){entering=false;return showAuth();}
  const {data:me,error}=await sb.from('profiles').select(PROFILE_COLS).eq('id',user.id).single();
  if(error||!me){entering=false;toast('Δεν βρέθηκε προφίλ');await sb.auth.signOut();return;}
  state.me=me;
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  renderMe();
  await Promise.all([loadConvs(),loadSocial()]);
  subscribe();
  entering=false;
}
function showAuth(){
  Object.assign(state,{me:null,convs:[],friends:[],incoming:[],outgoing:[],activeId:null});
  if(state.channel){sb.removeChannel(state.channel);state.channel=null;}
  $('app').classList.add('hidden');$('auth').classList.remove('hidden');document.title='FriendlyChat';
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    $('app').classList.add('hidden');$('auth').classList.remove('hidden');
    ['authTabs','loginForm','signupForm'].forEach(id=>$(id).classList.add('hidden'));
    $('resetForm').classList.remove('hidden');hideAuthMsg();return;
  }
  if(event==='SIGNED_OUT'){showAuth();return;}
  if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&session&&!state.me)setTimeout(enterApp,0);
  if(event==='INITIAL_SESSION'&&!session){showAuth();setTab('login');}
});

/* ================= DATA ================= */
async function loadConvs(){
  const {data,error}=await sb.rpc('my_conversations');
  if(error){toast('Σφάλμα φόρτωσης συνομιλιών');return;}
  state.convs=data||[];
  if(state.activeId){const c=activeConv();if(c)c.unread=0;else closeChat();}
  renderHome();
  if(state.activeId)renderChatHead();
}
async function loadSocial(){
  const [f,r]=await Promise.all([
    sb.rpc('my_friends'),
    sb.from('friend_requests').select(`sender_id,receiver_id,status,created_at,sender:profiles!friend_requests_sender_id_fkey(${PROFILE_COLS}),receiver:profiles!friend_requests_receiver_id_fkey(${PROFILE_COLS})`).eq('status','pending')
  ]);
  state.friends=f.data||[];
  const reqs=r.data||[];
  state.incoming=reqs.filter(x=>x.receiver_id===state.me.id).map(x=>x.sender).filter(Boolean);
  state.outgoing=reqs.filter(x=>x.sender_id===state.me.id).map(x=>x.receiver).filter(Boolean);

}
const reloadConvs=debounce(loadConvs,250);
const reloadSocial=debounce(loadSocial,250);

/* ================= HOME ================= */
function renderMe(){
  $('meAvatar').innerHTML=avP(state.me,'me');
  $('meName').textContent=state.me.username;
}
function renderHome(){
  if(!state.me)return;
  renderFriends();renderTabs();renderConvs();
  const total=state.convs.reduce((s,c)=>s+(c.id===state.activeId?0:(c.unread||0)),0)+state.incoming.length;
  document.title=total?`(${total}) FriendlyChat`:'FriendlyChat';
}
function directWith(uid){return state.convs.find(c=>!c.is_group&&(c.members||[]).some(m=>m.id===uid));}
function renderFriends(){
  const row=$('friendsRow');
  let html=`<button class="friend" id="addFriendsBtn"><div class="add-circle">${ICON_PLUS}</div><span class="nm" style="color:var(--muted)">Βρες φίλους</span></button>`;
  html+=state.friends.map(f=>{
    const c=directWith(f.id);const unread=c&&c.unread&&c.id!==state.activeId;
    return `<button class="friend" data-id="${f.id}"><div class="ring${unread?' on':''}">${avP(f,'lg')}</div><span class="nm">${esc(firstName(f))}</span></button>`;
  }).join('');
  row.innerHTML=html;
  $('addFriendsBtn').onclick=()=>{$('search').focus();};
  row.querySelectorAll('.friend[data-id]').forEach(b=>b.onclick=()=>startDirect(b.dataset.id));
}
function renderTabs(){
  const unreadIn=g=>state.convs.filter(c=>c.is_group===g&&c.id!==state.activeId&&c.unread>0).length;
  document.querySelectorAll('.tabbar .pill').forEach(p=>{
    p.classList.toggle('on',p.dataset.tab===state.tab);
    const u=unreadIn(p.dataset.tab==='groups');
    p.innerHTML=(p.dataset.tab==='groups'?'Ομάδες':'Συνομιλίες')+(u&&p.dataset.tab!==state.tab?` <span class="badge" style="background:var(--accent)">${u}</span>`:'');
  });
  const n=state.incoming.length;
  $('reqBtn').className='req-link'+(n?' has':'');
  $('reqBtn').innerHTML=`Αιτήματα${n?` <span class="badge">${n}</span>`:''}`;
}
document.querySelectorAll('.tabbar .pill').forEach(p=>p.onclick=()=>{state.tab=p.dataset.tab;renderHome();});
$('reqBtn').onclick=openRequests;

function convRowHTML(c){
  const title=convTitle(c);
  const unread=c.id===state.activeId?0:(c.unread||0);
  let text;
  if(unread)text=unread===1?'1 νέο μήνυμα':(unread>9?'9+':unread)+' νέα μηνύματα';
  else if(c.last_message!=null){
    if(c.last_sender===state.me.id)text='Εσύ: '+c.last_message;
    else if(c.is_group){const s=(c.members||[]).find(m=>m.id===c.last_sender);text=(s?firstName(s)+': ':'')+c.last_message;}
    else text=c.last_message;
  }else text=c.is_group?'Η ομάδα δημιουργήθηκε':'Πείτε γεια 👋';
  return `<button class="conv${c.id===state.activeId?' on':''}${unread?' unread':''}" data-id="${c.id}">
    ${convAvatar(c)}
    <div class="conv-body"><div class="conv-name">${esc(title)}</div>
      <div class="conv-sub"><span class="t">${esc(text)}</span><span class="w">&nbsp;· ${rel(c.last_message_at)}</span></div></div>
    ${unread?'<span class="dot"></span>':''}</button>`;
}
function renderConvs(){
  const list=$('convList');
  const groups=state.tab==='groups';
  const items=state.convs.filter(c=>c.is_group===groups);
  let html='';
  if(groups)html+=`<button class="conv" id="newGroupRow"><div class="add-circle" style="width:56px;height:56px;margin:0">${ICON_PLUS}</div><div class="conv-body"><div class="conv-name" style="font-weight:600">Νέα ομάδα</div><div class="conv-sub"><span class="t">Διάλεξε φίλους και δώσε όνομα</span></div></div></button>`;
  if(!items.length){
    html+=groups
      ?`<div class="empty">Δεν είσαι ακόμα σε καμία ομάδα.</div>`
      :(state.friends.length
        ?`<div class="empty"><b>Καμία συνομιλία ακόμα</b>Πάτα έναν φίλο από πάνω για να του στείλεις μήνυμα.</div>`
        :`<div class="empty"><b>Ξεκίνα προσθέτοντας φίλους</b>Ψάξε κάποιον με το όνομα χρήστη του και στείλε αίτημα. Μόλις το δεχτεί, θα εμφανιστεί εδώ πάνω.</div>`);
  }else html+=items.map(convRowHTML).join('');
  list.innerHTML=html;
  list.querySelectorAll('.conv[data-id]').forEach(b=>b.onclick=()=>openConv(b.dataset.id));
  const ng=$('newGroupRow');if(ng)ng.onclick=()=>openCompose(true);
}
setInterval(()=>{if(state.me&&!$('homeView').hidden)renderConvs();},60000);

/* ================= SEARCH ================= */
const searchInp=$('search');
function setSearching(on){
  $('searchView').hidden=!on;$('homeView').hidden=on;$('searchClear').classList.toggle('hidden',!on);
}
searchInp.addEventListener('focus',()=>{setSearching(true);runSearch();});
$('searchClear').onclick=()=>{searchInp.value='';setSearching(false);searchInp.blur();};
function actionBtnHTML(uid){
  switch(relation(uid)){
    case 'friends':return `<button class="btn btn-soft btn-sm" data-act="msg" data-id="${uid}">Μήνυμα</button>`;
    case 'outgoing':return `<button class="btn btn-soft btn-sm" data-act="cancel" data-id="${uid}">Εστάλη</button>`;
    case 'incoming':return `<button class="btn btn-primary btn-sm" data-act="accept" data-id="${uid}">Αποδοχή</button>`;
    default:return `<button class="btn btn-primary btn-sm" data-act="add" data-id="${uid}">Προσθήκη</button>`;
  }
}
async function doAction(act,uid){
  if(act==='msg')return startDirect(uid);
  let error;
  if(act==='add')({error}=await sb.rpc('send_friend_request',{target:uid}));
  if(act==='cancel')({error}=await sb.rpc('cancel_friend_request',{target:uid}));
  if(act==='accept')({error}=await sb.rpc('respond_friend_request',{from_user:uid,accept:true}));
  if(act==='decline')({error}=await sb.rpc('respond_friend_request',{from_user:uid,accept:false}));
  if(act==='remove')({error}=await sb.rpc('remove_friend',{target:uid}));
  if(error)return toast('Κάτι πήγε στραβά');
  if(act==='add')toast(relation(uid)==='incoming'?'Είστε πλέον φίλοι':'Το αίτημα στάλθηκε');
  if(act==='accept')toast('Είστε πλέον φίλοι');
  await loadSocial();
  if(!$('searchView').hidden)runSearch();
}
function wireActions(root){
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.disabled=true;doAction(b.dataset.act,b.dataset.id);});
}
let searchSeq=0;
const runSearch=debounce(async()=>{
  const view=$('searchView');const q=searchInp.value.trim().toLowerCase();
  const seq=++searchSeq;
  if(!q){
    view.innerHTML=`<div class="empty">Γράψε το όνομα χρήστη κάποιου για να τον βρεις και να του στείλεις αίτημα φιλίας.</div>`;return;
  }
  const clean=q.replace(/[^a-z0-9_]/g,'');
  let people=[];
  if(clean){
    const {data}=await sb.from('profiles').select(PROFILE_COLS).ilike('username',`%${clean}%`).neq('id',state.me.id).order('username').limit(25);
    people=data||[];
  }
  if(seq!==searchSeq)return;
  const convs=state.convs.filter(c=>convTitle(c).toLowerCase().includes(q)||others(c).some(m=>m.username.includes(clean||'\u0000')));
  let html='';
  if(convs.length)html+=`<div class="sect">Συνομιλίες</div>`+convs.map(convRowHTML).join('');
  html+=`<div class="sect">Άτομα</div>`;

// Another user's profile
function openUser(p){
  if(!p)return;
  const draw=()=>{
    // use the freshest copy we have (friends list is reloaded more often)
    p=state.friends.find(f=>f.id===p.id)||p;
    const r=relation(p.id);
    let btns='';
    if(r==='friends')btns=`<button class="btn btn-primary" data-act="msg" data-id="${p.id}">Μήνυμα</button><button class="btn btn-soft" id="unfriend">Φίλοι ✓</button>`;
    else if(r==='outgoing')btns=`<button class="btn btn-soft" data-act="cancel" data-id="${p.id}">Ακύρωση αιτήματος</button>`;
    else if(r==='incoming')btns=`<button class="btn btn-primary" data-act="accept" data-id="${p.id}">Αποδοχή</button><button class="btn btn-soft" data-act="decline" data-id="${p.id}">Διαγραφή</button>`;
    else btns=`<button class="btn btn-primary" data-act="add" data-id="${p.id}">Αποστολή αιτήματος φιλίας</button>`;
    const note=r==='incoming'?`<p class="hint" style="margin-top:10px">Σου έστειλε αίτημα φιλίας.</p>`:r==='none'?`<p class="hint" style="margin-top:10px">Για να μιλήσετε, πρέπει να δεχτεί το αίτημά σου.</p>`:'';
    const photo=safeAvatar(p.avatar_url);
    $('sheetBody').innerHTML=`<div class="profile-card"><div id="userPic">${avP(p,'xxl'+(photo?' zoomable':''))}</div><h3>${esc(nameOf(p))}</h3><div class="u">@${esc(p.username)}</div>
      ${p.bio?`<p class="bio">${linkify(p.bio)}</p>`:''}
      <div class="btns">${btns}</div>${note}</div>`;
    wireActions($('sheetBody'));
    if(photo)$('userPic').onclick=()=>viewPhoto(photo);
    const uf=$('unfriend');
    if(uf)uf.onclick=async()=>{if(!confirm(`Αφαίρεση του/της ${nameOf(p)} από τους φίλους;`))return;await doAction('remove',p.id);};
    $('sheetBody').querySelectorAll('[data-act=msg]').forEach(b=>b.addEventListener('click',closeSheet));
  };
  openSheet('Προφίλ','');draw();sheetRefresher=draw;
}

// Compose: pick friends -> 1 = direct, 2+ = group

  openSheet(groupMode?'Νέα ομάδα':'Νέο μήνυμα',
    `<div class="sheet-pad"><input class="inp" id="gName" maxlength="60" placeholder="Όνομα ομάδας" style="margin-bottom:8px" ${groupMode?'':'hidden'}>

    `<button class="btn btn-primary" id="goBtn" style="width:100%" disabled>Συνομιλία</button>`);
  const draw=()=>{
    const q=$('fFilter').value.trim().toLowerCase();
    const fr=state.friends.filter(f=>!q||f.username.includes(q)||nameOf(f).toLowerCase().includes(q));
    $('fList').innerHTML=!state.friends.length
      ?`<div class="empty"><b>Δεν έχεις φίλους ακόμα</b>Βρες άτομα από την αναζήτηση και στείλε τους αίτημα.</div>`

    });
    $('chips').innerHTML=[...sel.values()].map(f=>`<span class="chip">${esc(firstName(f))}<button data-id="${f.id}">×</button></span>`).join('');
    $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{sel.delete(b.dataset.id);draw();});
    const group=groupMode||sel.size>1;
    $('gName').hidden=!group;

    $('goBtn').disabled=sel.size===0||(group&&!$('gName').value.trim());
  };
  $('fFilter').addEventListener('input',draw);$('gName').addEventListener('input',draw);
  $('goBtn').onclick=async()=>{
    $('goBtn').disabled=true;

    closeSheet();state.tab='groups';await loadConvs();openConv(convId);
  };
  draw();sheetRefresher=draw;

// Instagram-style "move and scale": drag to position, pinch / wheel / slider to zoom.
// Resolves with a 512x512 JPEG Blob, or null if cancelled.
function cropPhoto(file,outSize=512){
  return new Promise((resolve,reject)=>{
    const src=URL.createObjectURL(file);
    const img=new Image();
    img.onerror=()=>{URL.revokeObjectURL(src);reject(new Error('image'));};
    img.onload=()=>{
      const W=img.naturalWidth,H=img.naturalHeight,MAXZ=5;
      const el=document.createElement('div');el.className='crop';
      el.innerHTML=`
        <div class="crop-head"><button id="cropCancel">Άκυρο</button><b>Μετακίνηση και κλιμάκωση</b><button class="done" id="cropDone">Τέλος</button></div>
        <div class="crop-stage"><div class="crop-box" id="cropBox"><div class="crop-grid"></div><div class="crop-mask"></div></div></div>
        <div class="crop-foot">
          <div class="zoom-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></svg>
            <input type="range" id="cropZoom" min="1" max="${MAXZ}" step="0.01" value="1" aria-label="Ζουμ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg>
          </div>
          <p class="hint">Σύρε για μετακίνηση · τσίμπημα ή μπάρα για ζουμ</p>
        </div>`;
      document.body.appendChild(el);
      const box=el.querySelector('#cropBox'),slider=el.querySelector('#cropZoom');
      img.draggable=false;box.prepend(img);

      let V=box.clientWidth,z=1,x=0,y=0;
      const base=()=>V/Math.min(W,H);
      const scale=()=>base()*z;
      function clamp(){
        const s=scale();
        x=Math.min(0,Math.max(V-W*s,x));
        y=Math.min(0,Math.max(V-H*s,y));
      }
      function draw(){clamp();img.style.transform=`translate(${x}px,${y}px) scale(${scale()})`;slider.value=z;}
      // zoom keeping the point (px,py) inside the box fixed
      function zoomAt(nz,px=V/2,py=V/2){
        nz=Math.min(MAXZ,Math.max(1,nz));
        const s=scale(),ix=(px-x)/s,iy=(py-y)/s;
        z=nz;const s2=scale();x=px-ix*s2;y=py-iy*s2;draw();
      }
      // start centred
      x=(V-W*scale())/2;y=(V-H*scale())/2;draw();

      const onResize=()=>{const old=V,s=scale();const cx=(old/2-x)/s,cy=(old/2-y)/s;V=box.clientWidth;x=V/2-cx*scale();y=V/2-cy*scale();draw();};
      addEventListener('resize',onResize);

      // pointer: 1 finger drag, 2 fingers pinch
      const pts=new Map();let last=null;
      const rect=()=>box.getBoundingClientRect();
      function gesture(){
        const a=[...pts.values()],r=rect();
        if(a.length===1)return {cx:a[0].x-r.left,cy:a[0].y-r.top,d:0};
        return {cx:(a[0].x+a[1].x)/2-r.left,cy:(a[0].y+a[1].y)/2-r.top,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
      }
      box.addEventListener('pointerdown',e=>{
        box.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        last=gesture();box.classList.add('moving');
      });
      box.addEventListener('pointermove',e=>{
        if(!pts.has(e.pointerId))return;
        pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        const g=gesture();
        if(pts.size>=2&&last.d&&g.d)zoomAt(z*g.d/last.d,g.cx,g.cy);
        x+=g.cx-last.cx;y+=g.cy-last.cy;draw();
        last=g;
      });
      const up=e=>{pts.delete(e.pointerId);last=pts.size?gesture():null;if(!pts.size)box.classList.remove('moving');};
      box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
      box.addEventListener('wheel',e=>{
        e.preventDefault();const r=rect();
        zoomAt(z*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);
      },{passive:false});
      slider.addEventListener('input',()=>zoomAt(parseFloat(slider.value)));

      function finish(result){
        removeEventListener('resize',onResize);el.remove();URL.revokeObjectURL(src);resolve(result);
      }
      el.querySelector('#cropCancel').onclick=()=>finish(null);
      el.querySelector('#cropDone').onclick=()=>{
        const s=scale(),sx=-x/s,sy=-y/s,ss=V/s;
        const out=Math.round(Math.min(outSize,ss));
        const cv=document.createElement('canvas');cv.width=cv.height=out;
        const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,out,out);
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,sx,sy,ss,ss,0,0,out,out);
        cv.toBlob(b=>b?finish(b):(finish(null),toast('Δεν αποθηκεύτηκε η εικόνα')),'image/jpeg',0.88);
      };
    };
    img.src=src;
  });
}

    const btn=$('saveProfile');
    const newName=$('dispName').value.trim()||me.username;
    const newUser=$('editUser').value.trim();
    const newBio=bio.value.trim().slice(0,BIO_MAX);
    if(newUser!==me.username&&!unameOk)return toast('Διάλεξε ένα διαθέσιμο όνομα χρήστη');
    btn.disabled=true;btn.textContent='Αποθήκευση…';$('photoBox').classList.add('busy');
    const fail=(t)=>{btn.disabled=false;btn.textContent='Αποθήκευση';$('photoBox')?.classList.remove('busy');toast(t);};
    const changes={};

    // 1. photo
    let avatar_url=me.avatar_url;
    if(pendingPhoto instanceof Blob){
      const path=`${me.id}/${Date.now()}.jpg`;
      const {error}=await sb.storage.from('avatars').upload(path,pendingPhoto,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
      if(error)return fail('Η φωτογραφία δεν ανέβηκε');
      avatar_url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      clearOldAvatars(path);
    }else if(pendingPhoto===null){
      avatar_url=null;clearOldAvatars();
    }

    // 2. name, bio, photo url
    const {error:upErr}=await sb.from('profiles').update({display_name:newName,bio:newBio,avatar_url}).eq('id',me.id);
    if(upErr)return fail('Δεν αποθηκεύτηκε');
    Object.assign(changes,{display_name:newName,bio:newBio,avatar_url});

    // 3. username
    if(newUser!==me.username){
      const {data,error}=await sb.rpc('change_username',{new_username:newUser});
      if(error){
        patchMeEverywhere(changes);
        return fail(/username_taken/.test(error.message)?'Το όνομα χρήστη πιάστηκε μόλις τώρα':'Το όνομα χρήστη δεν άλλαξε');
      }
      changes.username=data;
    }

    patchMeEverywhere(changes);
    closeSheet();toast('Το προφίλ ενημερώθηκε');
  };
  $('logoutBtn').onclick=async()=>{closeSheet();await sb.auth.signOut();};
}
$('profileBtn').onclick=openMyProfile;

/* ================= CHAT ================= */
function activeConv(){return state.convs.find(c=>c.id===state.activeId);}
async function startDirect(uid){
  const existing=directWith(uid);
  if(existing){setSearching(false);searchInp.value='';return openConv(existing.id);}
  const {data:convId,error}=await sb.rpc('get_or_create_direct',{other_user:uid});
  if(error){toast(/not_friends/.test(error.message)?'Πρέπει πρώτα να γίνετε φίλοι':'Δεν ξεκίνησε η συνομιλία');return;}
  setSearching(false);searchInp.value='';
  state.tab='chats';await loadConvs();openConv(convId);
}
function renderChatHead(){
  const c=activeConv();if(!c)return;
  $('chatTitle').textContent=convTitle(c);
  $('chatAvatar').innerHTML=convAvatar(c,true);
  if(c.is_group)$('chatSub').textContent=others(c).map(firstName).join(', ')||'Μόνο εσύ';
  else{const o=others(c)[0];$('chatSub').textContent=o?o.username:'';}
}
async function openConv(id){
  state.activeId=id;state.msgs=[];state.hasOlder=false;
  $('placeholder').classList.add('hidden');$('chat').classList.remove('hidden');$('app').classList.add('show-chat');
  const c=activeConv();if(c)c.unread=0;
  renderHome();renderChatHead();$('messages').innerHTML='';
  const {data,error}=await sb.from('messages').select('id,conversation_id,sender_id,content,created_at')
    .eq('conversation_id',id).order('created_at',{ascending:false}).limit(PAGE);
  if(state.activeId!==id)return;
  if(error){toast('Σφάλμα φόρτωσης μηνυμάτων');return;}
  state.msgs=(data||[]).reverse();state.hasOlder=(data||[]).length===PAGE;
  renderMessages(true);
  sb.rpc('mark_read',{conv:id});
  if(!isTouch)$('msgInput').focus();
}
function closeChat(){
  state.activeId=null;state.msgs=[];
  $('chat').classList.add('hidden');$('placeholder').classList.remove('hidden');$('app').classList.remove('show-chat');
  renderHome();
}
$('backBtn').onclick=closeChat;
$('chatTitleBtn').onclick=()=>{
  const c=activeConv();if(!c)return;
  if(c.is_group)openGroupInfo(c);else{const o=others(c)[0];if(o)openUser(o);}
};
async function loadOlder(){
  if(!state.msgs.length)return;
  const box=$('messages');const prevH=box.scrollHeight;
  const {data}=await sb.from('messages').select('id,conversation_id,sender_id,content,created_at')
    .eq('conversation_id',state.activeId).lt('created_at',state.msgs[0].created_at).order('created_at',{ascending:false}).limit(PAGE);
  state.hasOlder=(data||[]).length===PAGE;
  state.msgs=(data||[]).reverse().concat(state.msgs);
  renderMessages(false);box.scrollTop=box.scrollHeight-prevH;
}
function renderMessages(scrollBottom){
  const c=activeConv();
  const members=new Map((c?.members||[]).map(m=>[m.id,m]));
  const box=$('messages');
  const keep=box.scrollTop;
  let html=state.hasOlder?`<button class="btn-link older" id="olderBtn">Προηγούμενα μηνύματα</button>`:'';
  if(!state.hasOlder&&c){
    const o=others(c)[0];
    html+=`<div class="chat-intro">${c.is_group?convAvatar(c).replace('class="stack"','class="stack" style="margin:0 auto"'):`<div style="display:flex;justify-content:center">${avP(o,'xl')}</div>`}
      <b>${esc(convTitle(c))}</b><span>${c.is_group?`${(c.members||[]).length} μέλη`:(o?'@'+esc(o.username):'')}</span>
      ${!c.is_group&&o?.bio?`<span class="bio">${linkify(o.bio)}</span>`:''}</div>`;
  }
  const gap=5*60e3;
  state.msgs.forEach((m,i)=>{
    const prev=state.msgs[i-1],next=state.msgs[i+1];
    const newDay=!prev||!sameDay(prev.created_at,m.created_at);
    if(newDay)html+=`<div class="day">${esc(fmtDay(m.created_at))}</div>`;
    const mine=m.sender_id===state.me.id;
    const first=newDay||prev.sender_id!==m.sender_id||(new Date(m.created_at)-new Date(prev.created_at))>gap;
    const last=!next||next.sender_id!==m.sender_id||!sameDay(next.created_at,m.created_at)||(new Date(next.created_at)-new Date(m.created_at))>gap;
    const s=members.get(m.sender_id);
    html+=`<div class="row ${mine?'mine':'theirs'}${first?' first':''}${last?' last':''}">`+
      (c?.is_group&&!mine&&first?`<div class="sender">${esc(s?nameOf(s):'Πρώην μέλος')}</div>`:'')+
      `<div class="bubble">${linkify(m.content)}</div>`+(last?`<div class="stamp">${fmtTime(m.created_at)}</div>`:'')+`</div>`;
  });
  box.innerHTML=html;
  const ob=$('olderBtn');if(ob)ob.onclick=loadOlder;
  if(scrollBottom)box.scrollTop=box.scrollHeight;else box.scrollTop=keep;
}
function appendMessage(m){
  if(state.msgs.some(x=>x.id===m.id))return;
  const box=$('messages');const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  state.msgs.push(m);renderMessages(false);
  if(near||m.sender_id===state.me.id)box.scrollTop=box.scrollHeight;
}
const input=$('msgInput');
function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';}
input.addEventListener('input',()=>{autosize();$('sendBtn').disabled=!input.value.trim();});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!isTouch&&!e.isComposing){e.preventDefault();$('composer').requestSubmit();}});
$('composer').addEventListener('submit',async e=>{
  e.preventDefault();
  const text=input.value.trim();if(!text||!state.activeId)return;
  const convId=state.activeId;
  input.value='';autosize();$('sendBtn').disabled=true;
  const {data,error}=await sb.from('messages').insert({conversation_id:convId,sender_id:state.me.id,content:text})
    .select('id,conversation_id,sender_id,content,created_at').single();
  if(error){toast('Το μήνυμα δεν στάλθηκε');input.value=text;autosize();$('sendBtn').disabled=false;return;}
  if(state.activeId===convId)appendMessage(data);
  bumpConv(data);
});
function bumpConv(m){
  const c=state.convs.find(c=>c.id===m.conversation_id);
  if(!c)return reloadConvs();
  c.last_message=m.content;c.last_sender=m.sender_id;c.last_message_at=m.created_at;
  state.convs.sort((a,b)=>new Date(b.last_message_at)-new Date(a.last_message_at));
  renderHome();
}

/* ================= REALTIME ================= */
function subscribe(){
  if(state.channel)sb.removeChannel(state.channel);
  state.channel=sb.channel('fc-'+state.me.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},({new:m})=>{
      if(m.conversation_id===state.activeId){
        appendMessage(m);
        if(document.visibilityState==='visible')sb.rpc('mark_read',{conv:m.conversation_id});
      }else if(m.sender_id!==state.me.id){
        const c=state.convs.find(c=>c.id===m.conversation_id);if(c)c.unread=(c.unread||0)+1;
      }
      bumpConv(m);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'conversation_members'},()=>reloadConvs())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},()=>reloadConvs())
    .on('postgres_changes',{event:'*',schema:'public',table:'friend_requests'},()=>reloadSocial())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},({new:p})=>{
      if(p.id===state.me.id)return;
      reloadSocial();reloadConvs();
    })
    .subscribe();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&state.me){
    if(state.activeId)sb.rpc('mark_read',{conv:state.activeId});
    reloadConvs();reloadSocial();
  }
});
</script>
