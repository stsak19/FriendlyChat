<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FriendlyChat">
<title>FriendlyChat</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --field:#efeff2; --line:#e6e6ea; --hover:#f4f4f6;
  --text:#0b0b0f; --muted:#737380; --accent:#4c5bf5; --accent-ink:#fff; --accent-soft:#e9ebff;
  --mine:#4c5bf5; --mine-ink:#fff; --theirs:#efeff2; --danger:#e5484d; --ok:#1a9a5a;
  --ring:linear-gradient(45deg,#f9a13b,#ee2a7b,#6228d7);
  --nav:#f6f6f8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --panel:#000000; --field:#1f1f24; --line:#26262c; --hover:#121216;
    --text:#f5f5f7; --muted:#9a9aa6; --accent:#6b78ff; --accent-soft:#1d2050;
    --mine:#5563f7; --theirs:#232329; --danger:#ff6369;
    --nav:#131316;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
/* the page itself never scrolls or bounces: only the lists inside it do,
   so the top bar, the search and the bottom navbar stay put */
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 16px stops iPhone from zooming in when you tap a field */
input,textarea,select{font-size:16px!important}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg{display:block}

/* ---------- Auth ---------- */
#auth{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;padding:24px 16px}
#auth .auth-card{margin:auto}
.auth-card{width:100%;max-width:380px;padding:8px 6px}
.brand{font-weight:800;font-size:30px;letter-spacing:-.02em;text-align:center;margin-bottom:6px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo-mark{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
@media (prefers-color-scheme: dark){.logo-mark{border-radius:22%;box-shadow:0 0 0 1px #34343c;filter:none}}
.auth-sub{color:var(--muted);margin:0 0 22px;text-align:center}
.tabs{display:flex;background:var(--field);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.inp{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:12px;background:var(--field);outline:none}
.inp:focus{border-color:var(--accent)}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.eye svg{width:21px;height:21px}
.eye .slash{display:none}
.eye.on{color:var(--text)}
.eye.on .slash{display:block}
.remember{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;cursor:pointer;user-select:none}
.remember input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
textarea.inp{resize:none;line-height:1.4}
.hint{font-size:12px;color:var(--muted);margin-top:5px;min-height:16px}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-soft{background:var(--field);color:var(--text)}
.btn-block{width:100%;margin-top:18px}
.btn-sm{padding:7px 14px;border-radius:10px;font-size:14px}
.btn-link{color:var(--accent);font-weight:600}
.btn-danger{color:var(--danger);font-weight:600}
.msg-box{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:14px}
.msg-box.err{background:rgba(229,72,77,.12);color:var(--danger)}
.msg-box.info{background:var(--accent-soft);color:var(--text)}
.link-row{text-align:center;margin-top:14px}

/* ---------- Layout ---------- */
/* the app follows the *visible* screen, so the keyboard never leaves a gap or hides the composer */
#app{position:absolute;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);display:flex;overflow:hidden}
aside{width:400px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;padding-top:max(12px,calc(env(safe-area-inset-top) + 10px))}
.top .uname{flex:1;text-align:center;font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:26px;height:26px}
.search-pill{margin:6px 16px 4px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:14px;padding:0 12px}
.search-pill svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search-pill input{flex:1;border:0;background:none;outline:none;padding:11px 0;min-width:0}
.search-pill .clear{color:var(--muted);font-size:13px;font-weight:600}
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.top,.search-pill,.navbar,.chat-head,.composer{flex-shrink:0}

/* friends row */
.friends-row{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
.friends-row::-webkit-scrollbar{display:none}
.friend{width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.friend .nm{font-size:12px;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{padding:3px;border-radius:50%;background:transparent}
.ring.on{background:var(--ring)}
.ring > div{border:2px solid var(--panel)}
.add-circle{width:66px;height:66px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--text);margin:3px}
.add-circle svg{width:26px;height:26px}

/* tabs */
.tabbar{display:flex;align-items:center;gap:8px;padding:6px 16px 8px}
.pill{padding:7px 14px;border-radius:999px;background:var(--field);font-weight:600;font-size:14px;color:var(--text)}
.pill.on{background:var(--text);color:var(--bg)}
.tabbar .sp{flex:1}
.req-link{font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.req-link.has{color:var(--accent)}
.badge{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:inline-grid;place-items:center}

/* conversations */
.conv{display:flex;gap:12px;align-items:center;padding:9px 16px;width:100%;text-align:left}
.conv:hover{background:var(--hover)}
.conv.on{background:var(--hover)}
.conv-body{flex:1;min-width:0}
.conv-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-name.flex{display:flex;align-items:center;gap:5px}
.conv-name .nm-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mute-ic{width:15px;height:15px;flex-shrink:0;color:var(--muted)}
.conv.muted .dot{background:var(--muted)}
.conv-sub{display:flex;font-size:14px;color:var(--muted);margin-top:1px;min-width:0}
.conv-sub .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.conv-sub .w{white-space:nowrap;flex-shrink:0}
.conv.unread .conv-name{font-weight:700}
.conv.unread .conv-sub{color:var(--text);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0}
.empty{padding:34px 24px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.sect{font-weight:700;font-size:15px;padding:14px 16px 6px}

/* avatars */
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0;font-size:19px;text-transform:uppercase;overflow:hidden}
.avatar{position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--field)}
.avatar.lg{width:66px;height:66px;font-size:22px}
.avatar.xl{width:92px;height:92px;font-size:32px}
.avatar.xxl{width:136px;height:136px;font-size:46px}
.avatar.me{width:38px;height:38px;font-size:14px}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.xs{width:30px;height:30px;font-size:12px}
.stack{position:relative;width:56px;height:56px;flex-shrink:0}
.stack .avatar{width:40px;height:40px;font-size:14px;position:absolute;border:2px solid var(--panel)}
.stack .avatar:first-child{top:0;left:0}
.stack .avatar:last-child{bottom:0;right:0}
.stack.sm{width:36px;height:36px}
.stack.sm .avatar{width:26px;height:26px;font-size:10px}

/* people rows */
.person{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
.person:hover{background:var(--hover)}
.person .n{flex:1;min-width:0}
.person .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .n span{font-size:13px;color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.person.sel .check{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;gap:6px;flex-shrink:0}

/* chat */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.placeholder .big{width:88px;height:88px;border-radius:50%;border:2px solid var(--text);display:grid;place-items:center;margin:0 auto 14px;color:var(--text)}
.placeholder .big svg{width:40px;height:40px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;background:var(--panel);position:relative;z-index:2;padding:8px 12px;padding-top:max(8px,calc(env(safe-area-inset-top) + 10px));border-bottom:1px solid var(--line)}
.chat-head .t{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px}
.chat-head .t .tt{min-width:0}
.chat-head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.chat-head .t b .mute-ic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:5px}
.chat-head .t span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}
.messages{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 12px 6px;display:flex;flex-direction:column}
.day{align-self:center;font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.row{display:flex;flex-direction:column;max-width:75%;margin-top:2px;position:relative}
.row.mine{align-self:flex-end;align-items:flex-end}
.row.theirs{align-self:flex-start;align-items:flex-start}
.row.first{margin-top:10px}
.sender{font-size:12px;color:var(--muted);margin:0 0 3px 12px}
.bubble{padding:9px 13px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere}
.row.mine .bubble{background:var(--mine);color:var(--mine-ink)}
.row.theirs .bubble{background:var(--theirs)}
.row.mine:not(.last) .bubble{border-bottom-right-radius:6px}
.row.mine:not(.first) .bubble{border-top-right-radius:6px}
.row.theirs:not(.last) .bubble{border-bottom-left-radius:6px}
.row.theirs:not(.first) .bubble{border-top-left-radius:6px}
.bubble a{color:inherit;text-decoration:underline}
.stamp{font-size:11px;color:var(--muted);margin:3px 8px 0}
.older{align-self:center;margin-bottom:6px;font-size:13px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:6px 10px;padding-bottom:max(8px,calc(env(safe-area-inset-bottom) - 14px))}
/* keyboard open: no home-bar space needed, sit right on the keyboard */
.kb-open .composer{padding-bottom:6px}
.composer .box{flex:1;display:flex;align-items:flex-end;background:var(--field);border-radius:24px;padding:4px 4px 4px 4px}
.ph-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--chat-accent,var(--accent));margin-right:4px}
.ph-btn svg{width:24px;height:24px}
.ph-btn:disabled{opacity:.4}
.composer textarea{flex:1;resize:none;max-height:140px;border:0;background:none;outline:none;line-height:1.35;padding:8px 0}
.send{height:36px;padding:0 14px;border-radius:18px;color:var(--accent);font-weight:700}
.send:disabled{opacity:.35;cursor:default}
.chat-intro{text-align:center;padding:24px 10px 8px}
.chat-intro b{display:block;font-size:18px;margin-top:10px}
.chat-intro span{color:var(--muted);font-size:14px}
.chat-intro .bio{display:block;margin:6px auto 0;max-width:320px;color:var(--text);white-space:pre-wrap}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{width:100%;max-width:440px;max-height:86dvh;background:var(--panel);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;padding:12px 10px 8px 18px}
.sheet-head h2{font-size:17px;margin:0;flex:1;text-align:center;padding-left:40px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px}
.sheet-pad{padding:0 16px}
.sheet-foot{padding:10px 16px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
.chip{background:var(--accent-soft);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;display:flex;align-items:center;gap:4px}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1}
.role{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.profile-card{text-align:center;padding:4px 16px 8px}
.profile-card .avatar{margin:0 auto}
.profile-card h3{margin:12px 0 2px;font-size:20px}
.profile-card .u{color:var(--muted)}
.profile-card .bio{margin:10px auto 0;max-width:340px;white-space:pre-wrap;overflow-wrap:anywhere}
.profile-card .btns{display:flex;gap:8px;margin-top:18px}
.profile-card .btns .btn{flex:1}
.photo-edit{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 16px 4px}
.photo-edit .pic{position:relative}
.photo-edit .cam{position:absolute;right:2px;bottom:2px;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:3px solid var(--panel)}
.photo-edit .cam svg{width:19px;height:19px}
.avatar.zoomable{cursor:zoom-in}

/* photo viewer */
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.viewer img{width:min(86vw,420px);height:min(86vw,420px);border-radius:50%;object-fit:cover}

/* cropper (Instagram-style move & scale) */
.crop{position:fixed;inset:0;z-index:65;background:#000;color:#fff;display:flex;flex-direction:column}
.crop-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,calc(env(safe-area-inset-top) + 10px))}
.crop-head b{font-size:17px}
.crop-head button{font-weight:600;padding:6px 4px}
.crop-head .done{color:#7d88ff}
.crop-stage{flex:1;display:grid;place-items:center;min-height:0}
.crop-box{position:relative;width:min(92vw,62dvh,440px);aspect-ratio:1;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.crop-box:active{cursor:grabbing}
.crop-box img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.6);pointer-events:none;outline:1px solid rgba(255,255,255,.7);outline-offset:-1px}
.crop-grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px) calc(66.66% + .5px),transparent 0),
             linear-gradient(0deg,transparent calc(33.33% - .5px),rgba(255,255,255,.45) calc(33.33% - .5px) calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),rgba(255,255,255,.45) calc(66.66% - .5px) calc(66.66% + .5px),transparent 0)}
.crop-box.moving .crop-grid{opacity:1}
.crop-foot{padding:16px 24px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.crop-foot .hint{color:#a8a8b3;margin:0}
.zoom-row{display:flex;align-items:center;gap:12px;width:100%;max-width:360px}
.zoom-row svg{width:20px;height:20px;flex-shrink:0;color:#ccc}
.zoom-row input{flex:1;accent-color:#7d88ff}
.photo-edit .links{display:flex;gap:16px;font-size:14px}
.photo-edit.busy .pic{opacity:.5}
.counter{float:right;font-weight:400;color:var(--muted)}
/* panes + bottom navbar */
.pane{flex:1;display:flex;flex-direction:column;min-height:0}
.pane[hidden]{display:none}
.navbar{display:flex;border-top:1px solid var(--line);background:var(--nav);padding:6px 8px max(6px,calc(env(safe-area-inset-bottom) - 18px))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted)}
.nav-btn.on{color:var(--text)}
.nav-ic{position:relative;height:28px;display:grid;place-items:center}
.nav-ic svg{width:26px;height:26px}
.nav-btn.on .nav-ic svg{stroke-width:2.5}
.nav-ic .badge{position:absolute;top:-4px;right:-10px}
.nav-ic .avatar{width:28px;height:28px;font-size:11px}
.nav-btn.on .nav-ic .avatar{box-shadow:0 0 0 2px var(--nav),0 0 0 4px var(--text)}

/* my profile page */
.me-head{display:flex;align-items:center;padding:14px 16px 6px;padding-top:max(14px,calc(env(safe-area-inset-top) + 10px))}
.me-head b{flex:1;font-size:22px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-top{display:flex;align-items:center;gap:22px;padding:10px 16px 4px}
.me-top .stats{display:flex;gap:26px}
/* night mode: the app goes dark after sunset, whatever the phone's setting */
html.night{
  --bg:#000000; --panel:#000000; --field:#1f1f24; --line:#26262c; --hover:#121216;
  --text:#f5f5f7; --muted:#9a9aa6; --accent:#6b78ff; --accent-soft:#1d2050;
  --mine:#5563f7; --theirs:#232329; --danger:#ff6369; --nav:#131316; color-scheme:dark;
}
html.night .messages.has-bg .row.theirs .bubble{background:rgba(30,30,35,.86);color:#f5f5f7}
html.night .messages.has-bg .reacts{background:#232329}
html.night .messages.has-bg .rq{background:rgba(30,30,35,.7);color:#c9c9d1}
.me-top .stat{text-align:center;padding:4px 8px;margin:-4px -8px;border-radius:12px}
.me-top .stat:active{background:var(--hover)}
.me-top .stat b{display:block;font-size:19px}
.me-top .stat span{font-size:13px;color:var(--muted)}
.me-info{padding:8px 16px 0}
.me-info .nm{font-weight:700}
.me-info .bio{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.me-btns{display:flex;gap:8px;padding:14px 16px 6px}
.me-btns .btn{flex:1;padding:9px 12px}
.lock-note{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:0 16px 8px}
.lock-note svg{width:14px;height:14px}

/* chat look: theme + background */
.chat{--chat-accent:var(--accent)}
.send{color:var(--chat-accent)}
.messages{background-position:center;background-size:cover;background-repeat:no-repeat}
.messages.has-bg .row.theirs .bubble{background:rgba(255,255,255,.88);color:#0b0b0f;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.messages.has-bg .day,.messages.has-bg .stamp,.messages.has-bg .sender,.messages.has-bg .sys,.messages.has-bg .chat-intro span,.messages.has-bg .rq-label,.messages.has-bg .edited{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.messages.has-bg .chat-intro b{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.messages.has-bg .day,.messages.has-bg .sys{background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;text-shadow:none}
.chat-intro .ttl{display:inline-flex!important;align-items:center;gap:5px;margin-top:12px;font-size:12.5px;background:var(--field);color:var(--muted);padding:5px 11px;border-radius:999px}
.chat-intro .ttl svg{width:13px;height:13px}
.messages.has-bg .chat-intro .ttl{background:rgba(0,0,0,.35);color:#fff;text-shadow:none}
.sys{align-self:center;text-align:center;font-size:12.5px;color:var(--muted);margin:10px 24px 4px;max-width:85%}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px;padding:4px 16px 6px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.swatch i{width:48px;height:48px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.swatch.on i{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--text)}
.swatch.on{color:var(--text);font-weight:600}
.swatch i.bg-photo{display:grid;place-items:center;background:var(--field) center/cover no-repeat;color:var(--muted)}
.swatch i.bg-photo svg{width:22px;height:22px}
.bg-row{display:flex;align-items:center;gap:12px;padding:4px 16px}
.bg-thumb{width:54px;height:80px;border-radius:10px;background:var(--field) center/cover no-repeat;flex-shrink:0;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.bg-row .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.nick-edit{display:flex;gap:8px;padding:6px 16px 10px}
.nick-edit .inp{padding:9px 12px}
.settings-top{text-align:center;padding:0 16px 6px}
.settings-top h3{margin:10px 0 2px;font-size:19px}
.settings-top .u{color:var(--muted);font-size:14px}
.settings-top .btn{margin-top:12px}
.set-group{margin:4px 16px 8px;border-radius:14px;background:var(--field);overflow:hidden}
.set-item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.set-item+.set-item{border-top:1px solid var(--line)}
.set-item>svg{width:22px;height:22px;flex-shrink:0}
.set-item .tx{flex:1;min-width:0}
.set-item .tx b{display:block;font-size:15px;font-weight:600}
.set-item .tx span{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.set-item.danger{color:var(--danger)}
button.set-item:active{background:var(--hover)}
.set-item.mute-opt{padding-left:48px}
.set-item.mute-opt .tx b{font-weight:500}
.switch{position:relative;width:51px;height:31px;flex-shrink:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.switch:disabled{opacity:.45;cursor:default}
.switch.busy{opacity:.6}
/* reactions */
.bubble{position:relative;z-index:1}
@media (pointer:coarse){.bubble{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}}
.row.has-rx{margin-bottom:4px}
.reacts{position:relative;z-index:1;margin-top:-8px;display:inline-flex;align-items:center;gap:1px;background:var(--field);border:2px solid var(--bg);border-radius:999px;padding:1px 6px;font-size:13px;line-height:18px}
.reacts span{font-size:12px;color:var(--muted);margin-left:3px;font-weight:600}
.row.mine .reacts{margin-right:10px}
.row.theirs .reacts{margin-left:10px}
.messages.has-bg .reacts{border-color:transparent;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.heart-pop{position:absolute;left:50%;top:50%;font-size:40px;pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:heartpop .7s ease-out forwards;z-index:2}
@keyframes heartpop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}55%{transform:translate(-50%,-50%) scale(.95)}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.rx-overlay{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadein .12s}
@keyframes fadein{from{opacity:0}}
.rx-clone{position:fixed;margin:0;pointer-events:none}
.rx-pop{position:fixed;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.rx-bar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:999px;padding:5px 6px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:rxin .16s ease-out}
@keyframes rxin{from{transform:scale(.85);opacity:0}}
.rx-bar button{width:40px;height:40px;border-radius:50%;font-size:27px;display:grid;place-items:center;transition:transform .12s}
.rx-bar button:active{transform:scale(1.25)}
.rx-bar button.on{background:var(--field)}
.rx-bar .more{font-size:22px;color:var(--muted);background:var(--field);width:34px;height:34px;margin-left:2px}
.rx-more{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--panel);border-radius:18px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.rx-more[hidden]{display:none}
.rx-more button{font-size:26px;height:44px;border-radius:12px}
.rx-more button.on{background:var(--field)}
.rx-menu{position:fixed;min-width:210px;background:var(--panel);border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.rx-menu button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:12px 16px;font-weight:600;font-size:15px}
.rx-menu button+button{border-top:1px solid var(--line)}
.rx-menu button.danger{color:var(--danger)}
.rx-menu svg{width:20px;height:20px}
.rx-who{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
.rx-who .n{flex:1;min-width:0}
.rx-who .n b{display:block;font-weight:600}
.rx-who .n span{font-size:13px;color:var(--muted)}
.rx-who .e{font-size:26px}
/* view-once photos */
.bubble.photo{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;cursor:default}
.bubble.photo .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);flex-shrink:0}
.row.theirs .bubble.photo .pi{background:rgba(128,128,128,.18)}
.bubble.photo .pi svg{width:19px;height:19px}
.bubble.photo b{display:block;font-size:15px}
.bubble.photo small{display:block;font-size:12.5px;opacity:.8}
.bubble.photo.fresh{cursor:pointer}
.row.theirs .bubble.photo.fresh{background:var(--mine);color:var(--mine-ink)}
.row.theirs .bubble.photo.fresh .pi{background:rgba(255,255,255,.22)}
.bubble.photo.done{opacity:.6}
.once-viewer{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.once-viewer .ov-top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,calc(env(safe-area-inset-top) + 10px))}
.once-viewer .ov-top b{flex:1;font-size:15px}
.once-viewer .ov-top button{font-size:30px;line-height:1;width:40px;height:40px}
.once-viewer .ov-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px}
.once-viewer img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.once-viewer .ov-note{text-align:center;font-size:13px;color:#bbb;padding:12px 16px max(16px,env(safe-area-inset-bottom))}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.send-photo{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px}
.send-photo img{max-width:100%;max-height:52dvh;border-radius:14px;object-fit:contain;background:var(--field)}
.send-photo .note{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.send-photo .note svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}

/* replies (Instagram style: label + faded quote above the bubble) */
.rq-label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin:0 10px 3px}
.rq-label svg{width:13px;height:13px;flex-shrink:0}
.rq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap;
  max-width:100%;text-align:left;font-size:14px;line-height:1.35;padding:8px 13px 16px;margin-bottom:-11px;border-radius:18px;background:var(--field);color:var(--muted);opacity:.85}
.rq.gone{font-style:italic}
.messages.has-bg .rq{background:rgba(255,255,255,.72);color:#3a3a44}
.bubble.flash{animation:flash 1.3s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--chat-accent)}100%{box-shadow:0 0 0 3px transparent}}
.edited{font-size:11px;color:var(--muted);margin:2px 10px 0}
/* swipe to reply */
.row.swipe-back{transition:transform .2s ease-out}
.swipe-ic{position:absolute;left:-38px;top:50%;width:30px;height:30px;border-radius:50%;background:var(--field);color:var(--text);display:grid;place-items:center;opacity:0;transform:translateY(-50%) scale(.6)}
.swipe-ic svg{width:17px;height:17px}
/* reply / edit bar above the composer */
.reply-bar{display:flex;align-items:center;gap:10px;padding:9px 12px 3px 16px;border-top:1px solid var(--line);flex-shrink:0}
.reply-bar>svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.reply-bar .tx{flex:1;min-width:0}
.reply-bar b{display:block;font-size:13px;font-weight:600}
.reply-bar span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.reply-bar button svg{width:18px;height:18px}
/* voice messages */
.mic-btn{margin-right:0;margin-left:2px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rec{flex:1;display:none;align-items:center;gap:10px;background:var(--field);border-radius:24px;padding:4px 4px 4px 14px;min-height:44px;overflow:hidden}
.composer.recording .box{display:none}
.composer.recording .rec{display:flex}
.rec .rdot{width:10px;height:10px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rec .rtime{font-variant-numeric:tabular-nums;font-weight:600;min-width:36px}
.rec .live{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;height:26px;overflow:hidden;min-width:0}
.rec .live i{width:3px;border-radius:2px;background:var(--danger);flex-shrink:0;opacity:.85}
.rec .rhint{color:var(--muted);font-size:13px;white-space:nowrap;padding-right:10px;transform:translateX(var(--sx,0px))}
.rec .rbtn{width:36px;height:36px;border-radius:50%;display:none;place-items:center;flex-shrink:0;color:var(--muted)}
.rec .rbtn svg{width:20px;height:20px}
.rec .rsend{background:var(--chat-accent);color:#fff}
.rec.locked .rbtn{display:grid}
.rec.locked .rhint{display:none}
.rec.locked{padding-left:4px}
.bubble.voice{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 7px;white-space:normal}
.vplay{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:rgba(255,255,255,.22)}
.row.theirs .vplay{background:rgba(128,128,128,.18)}
.vplay svg{width:15px;height:15px}
.wave{display:flex;align-items:center;gap:2px;height:28px;width:clamp(96px,38vw,170px)}
.wave i{flex:1;min-width:2px;max-width:3px;border-radius:2px;background:currentColor}
.bubble.voice.cur .wave i{opacity:.38}
.bubble.voice.cur .wave i.on{opacity:1}
.vdur{font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.85;min-width:30px;text-align:right}

/* feed */
.top .uname.left{text-align:left}
.nav-ic .ndot{position:absolute;top:-1px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--nav)}
#feedList{position:relative}
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.post-head{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px}
.post-head .ph{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.post-head .ph .n{min-width:0}
.post-head .ph b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-head .ph span span{display:block;font-size:12px;color:var(--muted)}
.post-head .icon-btn svg{width:22px;height:22px}
.post-media{position:relative;width:100%;background:var(--field);overflow:hidden}
.post-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.post-media img.ok{opacity:1}
.post-cap{padding:10px 14px 0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.post-cap b{margin-right:6px}
.post-text{padding:2px 16px 0;font-size:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.post-cap.clamp,.post-text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{color:var(--muted);font-size:14px;padding:2px 14px 0}
.post a{color:var(--accent)}
.new-pill{position:sticky;top:10px;z-index:3;display:block;margin:10px auto -46px;padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:6px}
.tile{aspect-ratio:1;background:var(--field) center/cover no-repeat;position:relative;overflow:hidden;text-align:left}
.tile.txt{padding:9px;background:linear-gradient(150deg,var(--accent-soft),var(--field))}
.tile.txt span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.ptabs{display:flex;border-top:1px solid var(--line);margin-top:10px}
.ptabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0 10px;color:var(--muted);font-weight:600;font-size:14px;border-top:1.5px solid transparent;margin-top:-1px}
.ptabs button svg{width:19px;height:19px}
.ptabs button i{font-style:normal;font-weight:500;font-size:12.5px;opacity:.8}
.ptabs button.on{color:var(--text);border-top-color:var(--text)}
.ptabs+.grid{margin-top:0}
.feed-tabs{margin-top:4px;border-top:0;border-bottom:1px solid var(--line);flex-shrink:0}
.feed-tabs button{border-top:0;border-bottom:1.5px solid transparent;margin:0 0 -1px;position:relative}
.feed-tabs button.on{border-bottom-color:var(--text)}
.feed-tabs button.has-new::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:-2px}
.tlist{display:flex;flex-direction:column}
.tcard{display:block;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
.tcard:active{background:var(--hover)}
.tcard .tt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tcard .tw{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.grid-empty{padding:26px 24px;text-align:center;color:var(--muted);font-size:14px}
.grid-empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.me-head .icon-btn svg{width:26px;height:26px}
.np{display:flex;flex-direction:column;gap:12px;padding:0 16px}
.np-pick{display:flex;align-items:center;justify-content:center;gap:10px;height:120px;border-radius:14px;border:2px dashed var(--line);color:var(--muted);font-weight:600}
.np-pick svg{width:26px;height:26px}
.np-prev{position:relative;border-radius:14px;overflow:hidden;background:var(--field)}
.np-prev img{display:block;width:100%;max-height:48dvh;object-fit:contain}
.np-x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.np-x svg{width:18px;height:18px}
.np .hint{display:flex;justify-content:space-between;margin-top:-4px}

@media (max-width:760px){
  aside{width:100%;border-right:0}
  main{display:none}
  #app.show-chat aside{display:none}
  #app.show-chat main{display:flex}
  .back{display:grid}
  .row{max-width:82%}
  .overlay{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:20px 20px 0 0;max-height:92dvh;border:0}
}
</style>

<!-- ============ AUTH ============ -->
<section id="auth" class="hidden">
  <div class="auth-card">

  <rect width="512" height="512" rx="112" fill="#000"/>

    <path id="bubble" d="M156 128 H356 A56 56 0 0 1 412 184 V288 A56 56 0 0 1 356 344 H214 L138 404 L152 344 A56 56 0 0 1 100 288 V184 A56 56 0 0 1 156 128 Z"/>
  </defs>
  <use href="#bubble" fill="#E8338A" transform="translate(16 16)"/>
  <use href="#bubble" fill="#FFF35C"/>
  <path transform="translate(236 268) rotate(37.1)"
        d="M14 -280 L64 -280 L30 -150 L78 -150 L0 0 L10 -118 L-40 -118 Z"
        fill="#FFF35C" stroke="#000" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill"/>
</svg>FriendlyChat</div>
    <p class="auth-sub">Μίλα με τους φίλους σου, ένας-προς-έναν ή σε ομάδες.</p>
    <div class="tabs" id="authTabs">
      <button data-tab="login" class="on">Σύνδεση</button>
      <button data-tab="signup">Εγγραφή</button>
    </div>

    <form id="loginForm" autocomplete="on">
      <label class="f" for="liEmail">Email</label>
      <input class="inp" id="liEmail" type="email" autocomplete="email" required>
      <label class="f" for="liPass">Κωδικός</label>
      <div class="pw-wrap"><input class="inp" id="liPass" type="password" autocomplete="current-password" required><button type="button" class="eye" aria-label="Εμφάνιση κωδικού" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg></button></div>
      <label class="remember"><input type="checkbox" id="rememberMe" checked>Να με θυμάσαι</label>
      <button class="btn btn-primary btn-block" type="submit">Σύνδεση</button>
    </form>

    <form id="signupForm" class="hidden" autocomplete="on">
      <label class="f" for="suUser">Όνομα χρήστη</label>
      <input class="inp" id="suUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required placeholder="π.χ. stathis_93">

// show / hide password
function wireEyes(root=document){
  root.querySelectorAll('.pw-wrap .eye').forEach(b=>{
    b.addEventListener('pointerdown',e=>e.preventDefault()); // keep the keyboard open
    b.onclick=()=>{
      const i=b.previousElementSibling,show=i.type==='password';
      i.type=show?'text':'password';b.classList.toggle('on',show);
      b.setAttribute('aria-label',show?'Απόκρυψη κωδικού':'Εμφάνιση κωδικού');
    };

(()=>{const em=lsGet('fc-email');if(em)$('liEmail').value=em;if(lsGet('fc-remember')==='0')$('rememberMe').checked=false;})();

const checkUsername=debounce(async(v)=>{
  const hint=$('userHint');
  if(!USERNAME_RE.test(v)){hint.className='hint bad';hint.textContent=v.length<3?'Τουλάχιστον 3 χαρακτήρες':'Μόνο λατινικά γράμματα, αριθμοί και _';return;}
  const {data,error}=await sb.rpc('username_available',{u:v});
  if($('suUser').value.trim().toLowerCase()!==v)return;
  if(error){hint.className='hint';hint.textContent='';return;}
  hint.className='hint '+(data?'ok':'bad');hint.textContent=data?'✓ Διαθέσιμο':'Το όνομα χρησιμοποιείται ήδη';
},350);
$('suUser').addEventListener('input',e=>{
  const clean=e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(clean!==e.target.value)e.target.value=clean;
  $('userHint').className='hint';$('userHint').textContent='Έλεγχος…';checkUsername(clean);
});
$('signupForm').addEventListener('submit',async e=>{
  e.preventDefault();hideAuthMsg();
  const username=$('suUser').value.trim().toLowerCase(),email=$('suEmail').value.trim(),password=$('suPass').value;
  if(!USERNAME_RE.test(username))return showAuthMsg('Το όνομα χρήστη δεν είναι έγκυρο.');
  if(password.length<6)return showAuthMsg('Ο κωδικός θέλει τουλάχιστον 6 χαρακτήρες.');
  const {data:free}=await sb.rpc('username_available',{u:username});
  if(free===false)return showAuthMsg('Το όνομα χρήστη χρησιμοποιείται ήδη. Διάλεξε άλλο.');
  $('signupBtn').disabled=true;
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});
  $('signupBtn').disabled=false;
  if(error){
    const m=error.message||'';
    if(/already registered|already exists/i.test(m))return showAuthMsg('Υπάρχει ήδη λογαριασμός με αυτό το email.');
    if(/database error/i.test(m))return showAuthMsg('Το όνομα χρήστη πιάστηκε μόλις τώρα. Διάλεξε άλλο.');
    if(/rate limit/i.test(m))return showAuthMsg('Πολλές εγγραφές μαζί. Δοκίμασε ξανά σε λίγο.');
    return showAuthMsg('Κάτι πήγε στραβά: '+m);
  }
  if(data?.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return showAuthMsg('Υπάρχει ήδη λογαριασμός με αυτό το email.');
  if(!data.session){
    $('signupForm').reset();$('userHint').className='hint';$('userHint').textContent='';
    setTab('login');showAuthMsg('Ο λογαριασμός δημιουργήθηκε. Συνδέσου με το email και τον κωδικό σου.','info');
  }
});
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();hideAuthMsg();
  const remember=$('rememberMe').checked,email=$('liEmail').value.trim();
  lsSet('fc-remember',remember?'1':'0');
  lsSet('fc-email',remember?email:null);
  const {error}=await sb.auth.signInWithPassword({email,password:$('liPass').value});
  if(error){
    const m=error.message||'';
    if(/invalid login/i.test(m))return showAuthMsg('Λάθος email ή κωδικός.');
    if(/not confirmed/i.test(m))return showAuthMsg('Ο λογαριασμός δεν έχει ενεργοποιηθεί ακόμα. Δοκίμασε ξανά σε λίγο.');
    return showAuthMsg(m);
  }
});
$('resetForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const {error}=await sb.auth.updateUser({password:$('newPass').value});
  if(error)return showAuthMsg(error.message);
  toast('Ο κωδικός άλλαξε');enterApp();
});

/* ================= SESSION ================= */
let entering=false;
async function enterApp(){
  if(entering)return;entering=true;
  const {data:{user}}=await sb.auth.getUser();
  if(!user){entering=false;return showAuth();}
  const {data:me,error}=await sb.from('profiles').select(PROFILE_COLS).eq('id',user.id).single();
  if(error||!me){entering=false;toast('Δεν βρέθηκε προφίλ');await sb.auth.signOut();return;}
  state.me=me;
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  renderMe();
  await Promise.all([loadConvs(),loadSocial()]);
  subscribe();
  entering=false;
  pushSync();
  checkFeedDot();
  if(location.search)openDeepLink(location.search);
}
function showAuth(){
  setView('messages');
  Object.assign(state,{me:null,convs:[],friends:[],incoming:[],outgoing:[],activeId:null,replyTo:null,editing:null,myPosts:null});
  resetFeed();$('feedDot').classList.add('hidden');
  if(state.channel){sb.removeChannel(state.channel);state.channel=null;}
  $('app').classList.add('hidden');$('auth').classList.remove('hidden');document.title='FriendlyChat';
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    $('app').classList.add('hidden');$('auth').classList.remove('hidden');
    ['authTabs','loginForm','signupForm'].forEach(id=>$(id).classList.add('hidden'));
    $('resetForm').classList.remove('hidden');hideAuthMsg();return;
  }
  if(event==='SIGNED_OUT'){showAuth();return;}
  if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&session&&!state.me)setTimeout(enterApp,0);
  if(event==='INITIAL_SESSION'&&!session){showAuth();setTab('login');}
});

async function loadConvs(){
  const {data,error}=await sb.rpc('my_conversations');
  if(error){toast('Σφάλμα φόρτωσης συνομιλιών');return;}
  state.convs=data||[];
  if(state.activeId){const c=activeConv();if(c)c.unread=0;else closeChat();}
  renderHome();
  if(state.activeId){renderChatHead();if(state.msgs.length)renderMessages(false);}
}
async function loadSocial(){
  const [f,r]=await Promise.all([
    sb.rpc('my_friends'),
    sb.from('friend_requests').select(`sender_id,receiver_id,status,created_at,sender:profiles!friend_requests_sender_id_fkey(${PROFILE_COLS}),receiver:profiles!friend_requests_receiver_id_fkey(${PROFILE_COLS})`).eq('status','pending')
  ]);
  state.friends=f.data||[];
  const reqs=r.data||[];
  state.incoming=reqs.filter(x=>x.receiver_id===state.me.id).map(x=>x.sender).filter(Boolean);
  state.outgoing=reqs.filter(x=>x.sender_id===state.me.id).map(x=>x.receiver).filter(Boolean);
  renderHome();
  refreshOpenSheet();
}
const reloadConvs=debounce(loadConvs,250);
const reloadSocial=debounce(loadSocial,250);

function convRowHTML(c){
  const title=convTitle(c);
  const unread=c.id===state.activeId?0:(c.unread||0);
  const muted=isMuted(c);
  let text;
  if(unread)text=unread===1?'1 νέο μήνυμα':(unread>9?'9+':unread)+' νέα μηνύματα';
  else if(c.last_message!=null){
    const lm=c.last_kind==='photo'||c.last_kind==='voice'?previewOf({kind:c.last_kind}):c.last_message;
    if(c.last_kind==='system')text=sysText(c,{sender_id:c.last_sender,content:c.last_message});
    else if(c.last_sender===state.me.id)text='Εσύ: '+lm;
    else if(c.is_group){const s=(c.members||[]).find(m=>m.id===c.last_sender);text=(s?memberFirst(s)+': ':'')+lm;}
    else text=lm;
  }else text=c.is_group?'Η ομάδα δημιουργήθηκε':'Πείτε γεια 👋';
  return `<button class="conv${c.id===state.activeId?' on':''}${unread?' unread':''}${muted?' muted':''}" data-id="${c.id}">
    ${convAvatar(c)}
    <div class="conv-body"><div class="conv-name flex"><span class="nm-t">${esc(title)}</span>${muted?muteIcon():''}</div>
      <div class="conv-sub"><span class="t">${esc(text)}</span><span class="w">&nbsp;· ${rel(c.last_message_at)}</span></div></div>
    ${unread?'<span class="dot"></span>':''}</button>`;
}

const searchInp=$('search');
function setSearching(on){
  $('searchView').hidden=!on;$('homeView').hidden=on;$('searchClear').classList.toggle('hidden',!on);
}

function actionBtnHTML(uid){
  switch(relation(uid)){
    case 'friends':return `<button class="btn btn-soft btn-sm" data-act="msg" data-id="${uid}">Μήνυμα</button>`;
    case 'outgoing':return `<button class="btn btn-soft btn-sm" data-act="cancel" data-id="${uid}">Εστάλη</button>`;
    case 'incoming':return `<button class="btn btn-primary btn-sm" data-act="accept" data-id="${uid}">Αποδοχή</button>`;
    default:return `<button class="btn btn-primary btn-sm" data-act="add" data-id="${uid}">Προσθήκη</button>`;
  }
}
async function doAction(act,uid){
  if(act==='msg')return startDirect(uid);
  let error;
  if(act==='add')({error}=await sb.rpc('send_friend_request',{target:uid}));
  if(act==='cancel')({error}=await sb.rpc('cancel_friend_request',{target:uid}));
  if(act==='accept')({error}=await sb.rpc('respond_friend_request',{from_user:uid,accept:true}));
  if(act==='decline')({error}=await sb.rpc('respond_friend_request',{from_user:uid,accept:false}));
  if(act==='remove')({error}=await sb.rpc('remove_friend',{target:uid}));
  if(error)return toast('Κάτι πήγε στραβά');
  if(act==='add')toast(relation(uid)==='incoming'?'Είστε πλέον φίλοι':'Το αίτημα στάλθηκε');
  if(act==='accept')toast('Είστε πλέον φίλοι');
  await loadSocial();
  if(!$('searchView').hidden)runSearch();
}
function wireActions(root){
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.disabled=true;doAction(b.dataset.act,b.dataset.id);});
}
let searchSeq=0;
const runSearch=debounce(async()=>{
  const view=$('searchView');const q=searchInp.value.trim().toLowerCase();
  const seq=++searchSeq;
  if(!q){
    view.innerHTML=`<div class="empty">Γράψε το όνομα χρήστη κάποιου για να τον βρεις και να του στείλεις αίτημα φιλίας.</div>`;return;
  }
  const clean=q.replace(/[^a-z0-9_]/g,'');
  let people=[];
  if(clean){
    const {data}=await sb.from('profiles').select(PROFILE_COLS).ilike('username',`%${clean}%`).neq('id',state.me.id).order('username').limit(25);
    people=data||[];
  }
  if(seq!==searchSeq)return;
  const convs=state.convs.filter(c=>convTitle(c).toLowerCase().includes(q)||others(c).some(m=>m.username.includes(clean||'\u0000')));
  let html='';

// Another user's profile
function openUser(p){
  if(!p)return;
  let posts; // their posts (friends only), loaded once
  let tab='photos';
  const draw=()=>{
    // use the freshest copy we have (friends list is reloaded more often)
    p=state.friends.find(f=>f.id===p.id)||p;
    const r=relation(p.id);
    let btns='';
    if(r==='friends')btns=`<button class="btn btn-primary" data-act="msg" data-id="${p.id}">Μήνυμα</button><button class="btn btn-soft" id="unfriend">Φίλοι ✓</button>`;
    else if(r==='outgoing')btns=`<button class="btn btn-soft" data-act="cancel" data-id="${p.id}">Ακύρωση αιτήματος</button>`;
    else if(r==='incoming')btns=`<button class="btn btn-primary" data-act="accept" data-id="${p.id}">Αποδοχή</button><button class="btn btn-soft" data-act="decline" data-id="${p.id}">Διαγραφή</button>`;
    else btns=`<button class="btn btn-primary" data-act="add" data-id="${p.id}">Αποστολή αιτήματος φιλίας</button>`;
    const note=r==='incoming'?`<p class="hint" style="margin-top:10px">Σου έστειλε αίτημα φιλίας.</p>`:r==='none'?`<p class="hint" style="margin-top:10px">Για να μιλήσετε, πρέπει να δεχτεί το αίτημά σου.</p>`:'';
    const photo=safeAvatar(p.avatar_url);

      ${p.bio?`<p class="bio">${linkify(p.bio)}</p>`:''}
      <div class="btns">${btns}</div>${note}</div>`+
      (r==='friends'?`<div id="userGrid">${posts?postsSectionHTML(posts,tab,false):'<div class="grid-empty">Φόρτωση…</div>'}</div>`:'');
    wireActions($('sheetBody'));

      if(posts)wireSection($('userGrid'),posts,t=>{tab=t;draw();});
      else if(posts===undefined){posts=null;loadUserPosts(p.id).then(x=>{posts=x;if(sheetRefresher===draw&&$('overlay'))draw();});}

  };

const MUTE_OPTS=[[15,'Για 15 λεπτά'],[60,'Για 1 ώρα'],[480,'Για 8 ώρες'],[1440,'Για 24 ώρες'],[0,'Μέχρι να το αλλάξω']];
function muteSub(c){
  if(!isMuted(c))return 'Θα λαμβάνεις ειδοποιήσεις για νέα μηνύματα';
  if(c.muted_until==='infinity')return 'Σε σίγαση μέχρι να το αλλάξεις';
  const d=new Date(c.muted_until);
  return `Σε σίγαση έως ${sameDay(d,new Date())?'':d.toLocaleDateString('el-GR',{weekday:'long'})+' '}${hhmm(d)}`;
}

    <button class="switch${on?' on':''}" id="muteSwitch" role="switch" aria-checked="${on}" aria-label="Σίγαση μηνυμάτων"></button></div>`;
  if(open&&!on)h+=MUTE_OPTS.map(([v,t])=>`<button class="set-item mute-opt" data-min="${v}"><div class="tx"><b>${t}</b></div></button>`).join('');

function afterMute(){renderHome();if(state.activeId)renderChatHead();}
function wireMute(c,redraw,setOpen){
  const sw=$('muteSwitch');if(!sw)return;
  sw.onclick=async()=>{
    if(!isMuted(c)){setOpen(o=>!o);redraw();return;}
    const prev=c.muted_until;c.muted_until=null;redraw();afterMute();
    const {error}=await sb.rpc('set_mute',{conv:c.id,minutes:null});
    if(error){c.muted_until=prev;redraw();afterMute();toast('Δεν άλλαξε η σίγαση');}
  };
  $('sheetBody').querySelectorAll('.mute-opt').forEach(b=>b.onclick=async()=>{
    const min=+b.dataset.min;setOpen(()=>false);
    const {data,error}=await sb.rpc('set_mute',{conv:c.id,minutes:min});
    if(error){redraw();return toast('Δεν άλλαξε η σίγαση');}
    c.muted_until=data;redraw();afterMute();toast('Η συνομιλία είναι σε σίγαση');
  });
}

/* ================= CHAT SETTINGS: theme, background, nicknames ================= */
const bgCache=new Map();
async function bgUrl(path){
  const hit=bgCache.get(path);if(hit&&hit.exp>Date.now())return hit.url;
  const {data,error}=await sb.storage.from('chat-backgrounds').createSignedUrl(path,6*3600);
  if(error||!data)return null;
  bgCache.set(path,{url:data.signedUrl,exp:Date.now()+5*3600e3});return data.signedUrl;
}
const isNightNow=()=>document.documentElement.classList.contains('night');
// a dark layer on top of a colour, gradient or photo
const dim=(v,a)=>`linear-gradient(rgba(0,0,0,${a}),rgba(0,0,0,${a})),${v}`;
function applyChatLook(c){
  const chat=$('chat'),t=THEMES[c.theme]||THEMES.default,night=isNightNow();
  let mine=t.mine||null,ink=t.ink||null;
  if(night&&mine){
    if(c.theme==='mono'){mine='#2c2c31';ink='#f5f5f7';}
    else mine=dim(mine,.35);
  }
  if(mine)chat.style.setProperty('--mine',mine);else chat.style.removeProperty('--mine');
  if(ink)chat.style.setProperty('--mine-ink',ink);else chat.style.removeProperty('--mine-ink');
  if(t.accent)chat.style.setProperty('--chat-accent',t.accent);else chat.style.removeProperty('--chat-accent');
  const box=$('messages');
  if(!c.background_path&&BGS[c.background_color]){
    const g=BGS[c.background_color].bg;
    box.dataset.bg='c:'+c.background_color;box.style.backgroundImage=night?dim(g,.55):g;box.classList.add('has-bg');return;
  }
  if(!c.background_path){box.classList.remove('has-bg');box.style.backgroundImage='';box.dataset.bg='';return;}
  const key=c.background_path+(night?'#n':'');
  if(box.dataset.bg===key&&box.classList.contains('has-bg'))return;
  box.dataset.bg=key;
  bgUrl(c.background_path).then(url=>{
    if(!url||state.activeId!==c.id||box.dataset.bg!==key)return;
    const img=`url("${url}")`;
    box.style.backgroundImage=night?dim(img,.55):img;box.classList.add('has-bg');
  });
}
// shrink a picked photo so it uploads fast (keeps its shape)
function shrinkImage(file,max=1600){
  return new Promise((resolve,reject)=>{
    const src=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
      const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(src);cv.toBlob(b=>b?resolve(b):reject(new Error('blob')),'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(src);reject(new Error('image'));};
    img.src=src;
  });
}
async function clearChatBgs(convId,keep=null){
  const {data}=await sb.storage.from('chat-backgrounds').list(convId,{limit:100});
  const old=(data||[]).map(f=>`${convId}/${f.name}`).filter(p=>p!==keep);
  if(old.length)await sb.storage.from('chat-backgrounds').remove(old);
}

function wireCustom(c,redraw,setEditing){
  const body=$('sheetBody');
  body.querySelectorAll('.swatch[data-theme]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.theme;if((c.theme||'default')===k)return;
    const prev=c.theme;c.theme=k;applyChatLook(c);redraw();
    const {error}=await sb.rpc('set_conversation_theme',{conv:c.id,new_theme:k});
    if(error){c.theme=prev;applyChatLook(c);redraw();toast('Δεν άλλαξε το θέμα');}
  });
  if(c.background_path)bgUrl(c.background_path).then(u=>{const t=$('bgThumb');if(u&&t){t.style.backgroundImage=`url("${u}")`;t.innerHTML='';}});
  $('bgPick').onclick=()=>$('bgFile').click();
  body.querySelectorAll('.swatch[data-bg]:not([data-bg=photo])').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.bg==='none'?null:b.dataset.bg;

    const prev={p:c.background_path,c:c.background_color};

  const save=$('nickSave');

// Instagram-style "move and scale": drag to position, pinch / wheel / slider to zoom.
// Resolves with a 512x512 JPEG Blob, or null if cancelled.
function cropPhoto(file,outSize=512){
  return new Promise((resolve,reject)=>{
    const src=URL.createObjectURL(file);
    const img=new Image();
    img.onerror=()=>{URL.revokeObjectURL(src);reject(new Error('image'));};
    img.onload=()=>{
      const W=img.naturalWidth,H=img.naturalHeight,MAXZ=5;
      const el=document.createElement('div');el.className='crop';
      el.innerHTML=`
        <div class="crop-head"><button id="cropCancel">Άκυρο</button><b>Μετακίνηση και κλιμάκωση</b><button class="done" id="cropDone">Τέλος</button></div>
        <div class="crop-stage"><div class="crop-box" id="cropBox"><div class="crop-grid"></div><div class="crop-mask"></div></div></div>
        <div class="crop-foot">
          <div class="zoom-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/></svg>
            <input type="range" id="cropZoom" min="1" max="${MAXZ}" step="0.01" value="1" aria-label="Ζουμ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg>
          </div>
          <p class="hint">Σύρε για μετακίνηση · τσίμπημα ή μπάρα για ζουμ</p>
        </div>`;
      document.body.appendChild(el);
      const box=el.querySelector('#cropBox'),slider=el.querySelector('#cropZoom');
      img.draggable=false;box.prepend(img);

      let V=box.clientWidth,z=1,x=0,y=0;
      const base=()=>V/Math.min(W,H);
      const scale=()=>base()*z;
      function clamp(){
        const s=scale();
        x=Math.min(0,Math.max(V-W*s,x));
        y=Math.min(0,Math.max(V-H*s,y));
      }
      function draw(){clamp();img.style.transform=`translate(${x}px,${y}px) scale(${scale()})`;slider.value=z;}
      // zoom keeping the point (px,py) inside the box fixed
      function zoomAt(nz,px=V/2,py=V/2){
        nz=Math.min(MAXZ,Math.max(1,nz));
        const s=scale(),ix=(px-x)/s,iy=(py-y)/s;
        z=nz;const s2=scale();x=px-ix*s2;y=py-iy*s2;draw();
      }
      // start centred
      x=(V-W*scale())/2;y=(V-H*scale())/2;draw();

      const onResize=()=>{const old=V,s=scale();const cx=(old/2-x)/s,cy=(old/2-y)/s;V=box.clientWidth;x=V/2-cx*scale();y=V/2-cy*scale();draw();};
      addEventListener('resize',onResize);

      // pointer: 1 finger drag, 2 fingers pinch
      const pts=new Map();let last=null;
      const rect=()=>box.getBoundingClientRect();
      function gesture(){
        const a=[...pts.values()],r=rect();
        if(a.length===1)return {cx:a[0].x-r.left,cy:a[0].y-r.top,d:0};
        return {cx:(a[0].x+a[1].x)/2-r.left,cy:(a[0].y+a[1].y)/2-r.top,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
      }
      box.addEventListener('pointerdown',e=>{
        box.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        last=gesture();box.classList.add('moving');
      });
      box.addEventListener('pointermove',e=>{
        if(!pts.has(e.pointerId))return;
        pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        const g=gesture();
        if(pts.size>=2&&last.d&&g.d)zoomAt(z*g.d/last.d,g.cx,g.cy);
        x+=g.cx-last.cx;y+=g.cy-last.cy;draw();
        last=g;
      });
      const up=e=>{pts.delete(e.pointerId);last=pts.size?gesture():null;if(!pts.size)box.classList.remove('moving');};
      box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
      box.addEventListener('wheel',e=>{
        e.preventDefault();const r=rect();
        zoomAt(z*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);
      },{passive:false});
      slider.addEventListener('input',()=>zoomAt(parseFloat(slider.value)));

      function finish(result){
        removeEventListener('resize',onResize);el.remove();URL.revokeObjectURL(src);resolve(result);
      }
      el.querySelector('#cropCancel').onclick=()=>finish(null);
      el.querySelector('#cropDone').onclick=()=>{
        const s=scale(),sx=-x/s,sy=-y/s,ss=V/s;
        const out=Math.round(Math.min(outSize,ss));
        const cv=document.createElement('canvas');cv.width=cv.height=out;
        const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,out,out);
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,sx,sy,ss,ss,0,0,out,out);
        cv.toBlob(b=>b?finish(b):(finish(null),toast('Δεν αποθηκεύτηκε η εικόνα')),'image/jpeg',0.88);
      };
    };
    img.src=src;
  });
}
async function clearOldAvatars(keepPath=null){
  const {data}=await sb.storage.from('avatars').list(state.me.id,{limit:100});
  const old=(data||[]).map(f=>`${state.me.id}/${f.name}`).filter(p=>p!==keepPath);
  if(old.length)await sb.storage.from('avatars').remove(old);
}
function patchMeEverywhere(changes){
  Object.assign(state.me,changes);
  // my copy inside conversation member lists
  state.convs.forEach(c=>(c.members||[]).forEach(m=>{if(m.id===state.me.id)Object.assign(m,changes);}));
  renderMe();renderHome();if(state.activeId){renderChatHead();renderMessages(false);}
}

function openMyProfile(){
  const me=state.me;
  let pendingPhoto; // undefined = no change, null = remove, Blob = new photo
  let unameOk=true;
  openSheet('Επεξεργασία προφίλ',`
    <div class="photo-edit" id="photoBox">
      <button class="pic" id="picBtn" aria-label="Αλλαγή φωτογραφίας"><span id="picPreview">${avP(me,'xxl')}</span><span class="cam">${ICON_CAM}</span></button>
      <div class="links"><button class="btn-link" id="pickPhoto">Αλλαγή φωτογραφίας</button><button class="btn-danger" id="removePhoto" ${me.avatar_url?'':'hidden'}>Αφαίρεση</button></div>
      <input type="file" id="avatarFile" accept="image/*" hidden>
    </div>
    <div class="sheet-pad">
      <label class="f" for="dispName">Όνομα</label>
      <input class="inp" id="dispName" maxlength="50" value="${esc(me.display_name||'')}">
      <div class="hint">Αυτό βλέπουν οι φίλοι σου. Μπορεί να έχει και ελληνικά.</div>

      <label class="f" for="editUser">Όνομα χρήστη</label>
      <input class="inp" id="editUser" maxlength="24" autocapitalize="none" spellcheck="false" autocomplete="off" value="${esc(me.username)}">
      <div class="hint" id="editUserHint">Με αυτό σε βρίσκουν στην αναζήτηση.</div>

      <label class="f" for="editBio">Βιογραφικό <span class="counter" id="bioCount"></span></label>
      <textarea class="inp" id="editBio" rows="3" maxlength="${BIO_MAX}" placeholder="Γράψε λίγα λόγια για σένα">${esc(me.bio||'')}</textarea>

      <button class="btn btn-primary btn-block" id="saveProfile">Αποθήκευση</button>
    </div>`);

  const bio=$('editBio');
  const count=()=>{$('bioCount').textContent=`${bio.value.length}/${BIO_MAX}`;};
  bio.addEventListener('input',count);count();

  // photo
  const pick=()=>$('avatarFile').click();
  $('picBtn').onclick=pick;$('pickPhoto').onclick=pick;
  $('avatarFile').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';
    if(!f)return;
    if(!f.type.startsWith('image/'))return toast('Διάλεξε μια εικόνα');
    try{
      const blob=await cropPhoto(f);
      if(!blob)return; // cancelled
      pendingPhoto=blob;
      const url=URL.createObjectURL(pendingPhoto);
      $('picPreview').innerHTML=`<div class="avatar xxl"><img src="${url}" alt=""></div>`;
      $('removePhoto').hidden=false;
    }catch{toast('Δεν άνοιξε η εικόνα. Δοκίμασε JPG ή PNG.');}
  };
  $('removePhoto').onclick=()=>{
    pendingPhoto=null;
    $('picPreview').innerHTML=av(nameOf(me),me.id,'xxl');
    $('removePhoto').hidden=true;
  };

  // username
  const uHint=$('editUserHint');
  const checkU=debounce(async v=>{
    if(v===me.username){unameOk=true;uHint.className='hint';uHint.textContent='Με αυτό σε βρίσκουν στην αναζήτηση.';return;}
    if(!USERNAME_RE.test(v)){unameOk=false;uHint.className='hint bad';uHint.textContent=v.length<3?'Τουλάχιστον 3 χαρακτήρες':'Μόνο λατινικά γράμματα, αριθμοί και _';return;}
    const {data}=await sb.rpc('username_available',{u:v});
    if($('editUser')?.value!==v)return;
    unameOk=!!data;uHint.className='hint '+(data?'ok':'bad');uHint.textContent=data?'✓ Διαθέσιμο':'Το όνομα χρησιμοποιείται ήδη';
  },350);
  $('editUser').addEventListener('input',e=>{
    const clean=e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,'');
    if(clean!==e.target.value)e.target.value=clean;
    unameOk=false;uHint.className='hint';uHint.textContent='Έλεγχος…';checkU(clean);
  });

  $('saveProfile').onclick=async()=>{
    const btn=$('saveProfile');
    const newName=$('dispName').value.trim()||me.username;
    const newUser=$('editUser').value.trim();
    const newBio=bio.value.trim().slice(0,BIO_MAX);
    if(newUser!==me.username&&!unameOk)return toast('Διάλεξε ένα διαθέσιμο όνομα χρήστη');
    btn.disabled=true;btn.textContent='Αποθήκευση…';$('photoBox').classList.add('busy');
    const fail=(t)=>{btn.disabled=false;btn.textContent='Αποθήκευση';$('photoBox')?.classList.remove('busy');toast(t);};
    const changes={};

    // 1. photo
    let avatar_url=me.avatar_url;
    if(pendingPhoto instanceof Blob){
      const path=`${me.id}/${Date.now()}.jpg`;
      const {error}=await sb.storage.from('avatars').upload(path,pendingPhoto,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
      if(error)return fail('Η φωτογραφία δεν ανέβηκε');
      avatar_url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      clearOldAvatars(path);
    }else if(pendingPhoto===null){
      avatar_url=null;clearOldAvatars();
    }

    // 2. name, bio, photo url
    const {error:upErr}=await sb.from('profiles').update({display_name:newName,bio:newBio,avatar_url}).eq('id',me.id);
    if(upErr)return fail('Δεν αποθηκεύτηκε');
    Object.assign(changes,{display_name:newName,bio:newBio,avatar_url});

    // 3. username
    if(newUser!==me.username){
      const {data,error}=await sb.rpc('change_username',{new_username:newUser});
      if(error){
        patchMeEverywhere(changes);
        return fail(/username_taken/.test(error.message)?'Το όνομα χρήστη πιάστηκε μόλις τώρα':'Το όνομα χρήστη δεν άλλαξε');
      }
      changes.username=data;
    }

    patchMeEverywhere(changes);
    closeSheet();toast('Το προφίλ ενημερώθηκε');
  };
}

function activeConv(){return state.convs.find(c=>c.id===state.activeId);}
async function startDirect(uid){
  const existing=directWith(uid);

function renderChatHead(){

  $('chatTitle').innerHTML=esc(convTitle(c))+(isMuted(c)?muteIcon():'');
  $('chatAvatar').innerHTML=convAvatar(c,true);
  if(c.is_group)$('chatSub').textContent=others(c).map(memberFirst).join(', ')||'Μόνο εσύ';
  else{const o=others(c)[0];$('chatSub').textContent=o?o.username:'';}

// leaving a chat: drop the reply/edit, stop any recording or playback
function resetComposer(){
  if(rec.on||rec.starting)stopRec(false);
  stopVoice();
  if(state.editing){state.editing=null;input.value='';autosize();}
  state.replyTo=null;renderReplyBar();
}
async function openConv(id){
  if(state.activeId!==id)resetComposer();
  state.activeId=id;state.msgs=[];state.hasOlder=false;state.replyCache=new Map();
  $('placeholder').classList.add('hidden');$('chat').classList.remove('hidden');$('app').classList.add('show-chat');
  const c=activeConv();if(c)c.unread=0;
  setUrl('?c='+id);clearNotifs('conv-'+id);
  renderHome();renderChatHead();$('messages').innerHTML='';
  state.views=new Map();
  const [{data,error},{data:views}]=await Promise.all([
    sb.from('messages').select(MSG_COLS).eq('conversation_id',id).order('created_at',{ascending:false}).limit(PAGE),
    sb.from('photo_views').select('message_id,user_id').eq('conversation_id',id)
  ]);
  if(state.activeId!==id)return;
  if(error){toast('Σφάλμα φόρτωσης μηνυμάτων');return;}
  (views||[]).forEach(v=>addView(v.message_id,v.user_id));
  state.msgs=(data||[]).reverse();state.hasOlder=(data||[]).length===PAGE;
  renderMessages(true);
  fetchReplyTargets();
  sb.rpc('mark_read',{conv:id});
  if(!isTouch)$('msgInput').focus();
}
function closeChat(){
  resetComposer();
  state.activeId=null;state.msgs=[];setUrl('');
  $('chat').classList.add('hidden');$('placeholder').classList.remove('hidden');$('app').classList.remove('show-chat');
  renderHome();
}
$('backBtn').onclick=closeChat;
$('chatTitleBtn').onclick=$('chatInfoBtn').onclick=()=>{const c=activeConv();if(c)openChatSettings(c);};
async function loadOlder(){
  if(!state.msgs.length)return;
  const box=$('messages');const prevH=box.scrollHeight;
  const {data}=await sb.from('messages').select(MSG_COLS)
    .eq('conversation_id',state.activeId).lt('created_at',state.msgs[0].created_at).order('created_at',{ascending:false}).limit(PAGE);
  state.hasOlder=(data||[]).length===PAGE;
  state.msgs=(data||[]).reverse().concat(state.msgs);
  renderMessages(false);box.scrollTop=box.scrollHeight-prevH;
  fetchReplyTargets();
}

/* ---- replies ---- */
function replyTarget(id){return msgById(id)||state.replyCache.get(id)||null;}
// quoted messages that are older than what's loaded
async function fetchReplyTargets(){
  const conv=state.activeId;
  const need=[...new Set(state.msgs.map(m=>m.reply_to).filter(id=>id&&!msgById(id)&&!state.replyCache.has(id)))];
  if(!need.length)return;
  const {data}=await sb.from('messages').select('id,sender_id,content,kind').in('id',need);
  if(state.activeId!==conv)return;
  const got=new Map((data||[]).map(x=>[x.id,x]));
  need.forEach(id=>state.replyCache.set(id,got.get(id)||null));
  renderMessages(false);
}
function replyHTML(m,mine,members){
  const t=replyTarget(m.reply_to);
  const first=id=>memberFirst(members.get(id));
  let label;
  if(mine){
    if(!t)label='Απάντησες';
    else if(t.sender_id===state.me.id)label='Απάντησες στον εαυτό σου';
    else label=`Απάντησες σε ${first(t.sender_id)}`;
  }else{
    const s=first(m.sender_id);
    if(!t)label=`${s} απάντησε`;
    else if(t.sender_id===state.me.id)label=`${s} σου απάντησε`;
    else if(t.sender_id===m.sender_id)label=`${s} απάντησε σε δικό του/της μήνυμα`;
    else label=`${s} απάντησε σε ${first(t.sender_id)}`;
  }
  return `<div class="rq-label">${ICON_REPLY}${esc(label)}</div><button class="rq${t?'':' gone'}" data-jump="${m.reply_to}">${esc(previewOf(t))}</button>`;
}
function jumpTo(id){
  const b=document.querySelector(`#messages .bubble[data-id="${id}"]`);
  if(!b)return toast(replyTarget(id)?'Το μήνυμα είναι πιο πάνω στη συνομιλία':'Το μήνυμα δεν είναι πια διαθέσιμο');
  b.scrollIntoView({behavior:'smooth',block:'center'});
  b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');
}
function renderReplyBar(){
  const bar=$('replyBar');const e=state.editing,r=state.replyTo;
  if(!e&&!r){bar.classList.add('hidden');bar.innerHTML='';syncComposer();return;}
  let title,sub;
  if(e){title='Επεξεργασία μηνύματος';sub=e.content;}
  else{
    const s=(activeConv()?.members||[]).find(x=>x.id===r.sender_id);
    title=r.sender_id===state.me.id?'Απάντηση στον εαυτό σου':`Απάντηση σε ${s?memberName(s):'…'}`;
    sub=previewOf(r);
  }
  bar.innerHTML=`${e?ICON_EDIT:ICON_REPLY}<div class="tx"><b>${esc(title)}</b><span>${esc(sub)}</span></div><button type="button" id="replyX" aria-label="Ακύρωση">${ICON_X}</button>`;
  bar.classList.remove('hidden');
  $('replyX').onclick=()=>{state.editing?cancelEdit():cancelReply();};

}
function startReply(m){
  if(!m||m.kind==='system')return;
  if(state.editing){state.editing=null;input.value='';autosize();}
  state.replyTo=m;renderReplyBar();input.focus();
}
function cancelReply(){state.replyTo=null;renderReplyBar();}
function startEdit(m){
  state.replyTo=null;state.editing=m;
  input.value=m.content;autosize();renderReplyBar();
  input.focus();try{input.setSelectionRange(input.value.length,input.value.length);}catch{}
}
function cancelEdit(){state.editing=null;input.value='';autosize();renderReplyBar();}
// mic when empty, "Send" when there's text, "Save" when editing
function syncComposer(){
  const has=!!input.value.trim(),ed=!!state.editing,btn=$('sendBtn');
  btn.disabled=!has;btn.textContent=ed?'Αποθήκευση':'Αποστολή';
  btn.classList.toggle('hidden',!has&&!ed);
  $('micBtn').classList.toggle('hidden',has||ed);
  $('photoBtn').classList.toggle('hidden',ed);
}
async function saveEdit(text){
  const m=state.editing;
  if(text===m.content){cancelEdit();return;}
  const before={c:m.content,e:m.edited_at};
  m.content=text;m.edited_at=new Date().toISOString();cancelEdit();renderMessages(false);
  const {error}=await sb.rpc('edit_message',{msg:m.id,new_content:text});
  if(error){
    m.content=before.c;m.edited_at=before.e;renderMessages(false);

async function unsendMsg(m){
  if(!confirm('Αναίρεση αποστολής;\nΤο μήνυμα θα διαγραφεί για όλους στη συνομιλία.'))return;
  const i=state.msgs.indexOf(m);
  if(i>=0)state.msgs.splice(i,1);
  if(state.replyTo?.id===m.id)cancelReply();
  if(state.editing?.id===m.id)cancelEdit();
  if(player.id===m.id)stopVoice();
  renderMessages(false);
  const {error}=await sb.rpc('unsend_message',{msg:m.id});
  if(error){
    if(!msgById(m.id))state.msgs.splice(Math.max(0,i),0,m);
    renderMessages(false);return toast('Δεν έγινε η αναίρεση αποστολής');
  }
  if(m.kind==='voice')sb.storage.from('voice-notes').remove([m.content]);
  if(m.kind==='photo')sb.storage.from('chat-photos').remove([m.content]);
  reloadConvs();
}

function renderMessages(scrollBottom){
  const c=activeConv();
  const members=new Map((c?.members||[]).map(m=>[m.id,m]));
  const box=$('messages');
  const keep=box.scrollTop;
  let html=state.hasOlder?`<button class="btn-link older" id="olderBtn">Προηγούμενα μηνύματα</button>`:'';
  if(!state.hasOlder&&c){
    const o=others(c)[0];
    html+=`<div class="chat-intro">${c.is_group?convAvatar(c).replace('class="stack"','class="stack" style="margin:0 auto"'):`<div style="display:flex;justify-content:center">${avP(o,'xl')}</div>`}
      <b>${esc(convTitle(c))}</b><span>${c.is_group?`${(c.members||[]).length} μέλη`:(o?'@'+esc(o.username):'')}</span>
      ${!c.is_group&&o?.bio?`<span class="bio">${linkify(o.bio)}</span>`:''}
      <span class="ttl">${ICON_TIMER}Τα μηνύματα σβήνονται αυτόματα μετά από 24 ώρες</span></div>`;
  }
  const gap=5*60e3;
  state.msgs.forEach((m,i)=>{
    const prev=state.msgs[i-1],next=state.msgs[i+1];
    const newDay=!prev||!sameDay(prev.created_at,m.created_at);
    if(newDay)html+=`<div class="day">${esc(fmtDay(m.created_at))}</div>`;
    const mine=m.sender_id===state.me.id;
    const first=newDay||!!m.reply_to||prev.kind==='system'||prev.sender_id!==m.sender_id||(new Date(m.created_at)-new Date(prev.created_at))>gap;
    const last=!next||!!next.reply_to||next.kind==='system'||next.sender_id!==m.sender_id||!sameDay(next.created_at,m.created_at)||(new Date(next.created_at)-new Date(m.created_at))>gap;
    const s=members.get(m.sender_id);
    if(m.kind==='system'){html+=`<div class="sys">${esc(sysText(c,m))}</div>`;return;}
    const rx=m.reactions||[];
    let bubble;
    if(m.kind==='photo'){const p=photoBubble(m,mine,c);bubble=`<div class="bubble photo${p.cls}" data-id="${m.id}"${p.open?' data-open="1"':''}>${p.html}</div>`;}
    else if(m.kind==='voice')bubble=voiceBubble(m);
    else bubble=`<div class="bubble" data-id="${m.id}">${linkify(m.content)}</div>`;
    html+=`<div class="row ${mine?'mine':'theirs'}${first?' first':''}${last?' last':''}${rx.length?' has-rx':''}">`+
      (m.reply_to?replyHTML(m,mine,members)
        :(c?.is_group&&!mine&&first?`<div class="sender">${esc(s?memberName(s):'Πρώην μέλος')}</div>`:''))+
      bubble+reactsHTML(m)+(m.edited_at?`<div class="edited">Επεξεργάστηκε</div>`:'')+(last?`<div class="stamp">${fmtTime(m.created_at)}</div>`:'')+`</div>`;
  });
  box.innerHTML=html;
  const ob=$('olderBtn');if(ob)ob.onclick=loadOlder;
  if(scrollBottom)box.scrollTop=box.scrollHeight;else box.scrollTop=keep;
  voiceUI();prefetchVoices();
}
function appendMessage(m){
  if(state.msgs.some(x=>x.id===m.id))return;
  const box=$('messages');const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  state.msgs.push(m);renderMessages(false);

input.addEventListener('input',()=>{autosize();syncComposer();});
input.addEventListener('keydown',e=>{

$('composer').addEventListener('submit',async e=>{

function bumpConv(m){

/* ================= REALTIME ================= */
function subscribe(){
  if(state.channel)sb.removeChannel(state.channel);
  state.channel=sb.channel('fc-'+state.me.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},({new:m})=>{
      if(m.conversation_id===state.activeId){
        appendMessage(m);
        if(document.visibilityState==='visible')sb.rpc('mark_read',{conv:m.conversation_id});
      }else if(m.sender_id!==state.me.id&&m.kind!=='system'){
        const c=state.convs.find(c=>c.id===m.conversation_id);if(c)c.unread=(c.unread||0)+1;
      }
      bumpConv(m);
    })
    // edited message
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},({new:m})=>{
      const x=msgById(m.id)||state.replyCache.get(m.id);
      if(x){x.content=m.content;x.edited_at=m.edited_at;if(m.conversation_id===state.activeId)renderMessages(false);}
      if(state.replyTo?.id===m.id)renderReplyBar();
      reloadConvs();
    })
    // unsent (or expired) message
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},({old:o})=>{
      if(!o||o.id==null)return;
      const i=state.msgs.findIndex(x=>x.id===o.id);
      if(i>=0){
        if(player.id===o.id)stopVoice();
        state.msgs.splice(i,1);
        if(state.replyTo?.id===o.id)cancelReply();
        if(state.editing?.id===o.id)cancelEdit();
        renderMessages(false);
      }
      if(state.replyCache.has(o.id)){state.replyCache.set(o.id,null);renderMessages(false);}
      reloadConvs();
    })
    // feed: a friend posted / a post was deleted
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},({new:p})=>onNewPost(p))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'posts'},({old:o})=>{if(o&&o.id!=null)dropPost(o.id);})
    .on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},({new:n,old:o})=>{
      const id=(n&&n.message_id)||(o&&o.message_id);
      if(state.msgs.some(x=>x.id===id))refreshReactions(id);
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'photo_views'},({new:v})=>{
      if(v.conversation_id!==state.activeId)return;
      addView(v.message_id,v.user_id);renderMessages(false);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'conversation_members'},()=>reloadConvs())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},()=>reloadConvs())
    .on('postgres_changes',{event:'*',schema:'public',table:'friend_requests'},()=>reloadSocial())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},({new:p})=>{
      if(p.id===state.me.id)return;
      reloadSocial();reloadConvs();
    })
    .subscribe();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&state.me){
