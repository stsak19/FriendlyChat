const QUICK_RX=['❤️','😂','😮','😢','😡','👍'];
const MORE_RX=['🔥','👏','🎉','😍','🥰','😘','🤣','😅','😭','😱','🤯','🥳','😎','🤔','🙄','🙏','🙌','💪','👌','👀','💯','✨','💔','👎'];
function myReaction(m){return (m.reactions||[]).find(r=>r.user_id===state.me.id)?.emoji||null;}
function reactsHTML(m){

async function react(m,emoji){

  box.addEventListener('pointercancel',()=>{cancel();endSwipe(false);});
  box.addEventListener('scroll',cancel,{passive:true});
  box.addEventListener('contextmenu',e=>{

  });

  box.addEventListener('click',e=>{

    const r=e.target.closest('.reacts[data-rid]');if(r)return showReactors(+r.dataset.rid);

// hold the mic = record, let go = send, slide left = cancel.
// quick tap = hands-free recording with 🗑 and send buttons. Max 1 minute.
const VOICE_MAX=60e3;
const rec={on:false,starting:false,locked:false,holding:false};
function pickAudioType(){
  if(!window.MediaRecorder)return '';
  for(const t of ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']){
    try{if(MediaRecorder.isTypeSupported(t))return t;}catch{}
  }
  return '';
}
function audioInfo(type){
  const base=String(type||'').split(';')[0]||'audio/mp4';
  if(/webm/.test(base))return {type:'audio/webm',ext:'webm'};
  if(/ogg/.test(base))return {type:'audio/ogg',ext:'ogg'};
  return {type:'audio/mp4',ext:'mp4'};
}
function lockRec(){
  rec.locked=true;rec.holding=false;
  $('rec').classList.add('locked');$('rec').style.removeProperty('--sx');
}
async function startRec(){
  if(rec.on||rec.starting||!state.activeId)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){rec.holding=false;return toast('Αυτός ο browser δεν υποστηρίζει ηχογράφηση');}
  rec.starting=true;
  const conv=state.activeId;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
  catch(e){rec.starting=false;rec.holding=false;return toast(e&&e.name==='NotAllowedError'?'Δώσε άδεια για το μικρόφωνο από τις ρυθμίσεις':'Δεν άνοιξε το μικρόφωνο');}
  // cancelled or left the chat while the permission popup was up
  const gone=!rec.starting||state.activeId!==conv;
  rec.starting=false;
  if(gone){stream.getTracks().forEach(t=>t.stop());return;}
  const want=pickAudioType();
  let mr;
  try{mr=new MediaRecorder(stream,want?{mimeType:want}:undefined);}catch{mr=new MediaRecorder(stream);}
  Object.assign(rec,{on:true,stream,mr,chunks:[],peaks:[],t0:Date.now(),conv:state.activeId,reply:state.replyTo,type:mr.mimeType||want});
  // let go while the permission popup was up -> keep going hands-free
  if(!rec.holding)rec.locked=true;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data);};
  mr.start(250);
  rec.an=null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    rec.ctx=new AC();const src=rec.ctx.createMediaStreamSource(stream);
    rec.an=rec.ctx.createAnalyser();rec.an.fftSize=512;src.connect(rec.an);rec.buf=new Uint8Array(rec.an.fftSize);
  }catch{}
  $('composer').classList.add('recording');$('rec').classList.toggle('locked',rec.locked);
  $('recLive').innerHTML='';$('recTime').textContent='0:00';
  navigator.vibrate?.(15);
  rec.tick=setInterval(recTick,90);
}
function recTick(){
  const el=Date.now()-rec.t0;
  let lv=.04;
  if(rec.an){
    rec.an.getByteTimeDomainData(rec.buf);
    let s=0;for(const v of rec.buf){const d=(v-128)/128;s+=d*d;}
    lv=Math.min(1,Math.sqrt(s/rec.buf.length)*4);
  }
  rec.peaks.push(lv);
  $('recTime').textContent=fmtDur(Math.floor(el/1000)*1000);
  const live=$('recLive'),i=document.createElement('i');
  i.style.height=Math.max(10,lv*100)+'%';live.appendChild(i);
  while(live.children.length>70)live.firstChild.remove();
  if(el>=VOICE_MAX){stopRec(true);toast('Το φωνητικό φτάνει μέχρι 1 λεπτό');}
}
function stopRec(send){
  if(rec.starting){rec.starting=false;rec.holding=false;return;}
  if(!rec.on)return;
  const r={...rec},dur=Date.now()-r.t0;
  rec.on=false;rec.locked=false;rec.holding=false;clearInterval(r.tick);
  $('composer').classList.remove('recording');$('rec').classList.remove('locked');$('rec').style.removeProperty('--sx');
  const done=()=>{
    r.stream.getTracks().forEach(t=>t.stop());try{r.ctx?.close();}catch{}
    if(!send)return;
    if(dur<800)return toast('Πολύ σύντομο. Κράτα πατημένο το μικρόφωνο όσο μιλάς.');
    sendVoice(r,dur);
  };
  if(r.mr.state==='inactive')return done();
  r.mr.onstop=done;
  try{r.mr.stop();}catch{done();}
}
// ~40 bars for the bubble, scaled so the loudest bit fills it
function wavePeaks(p,n=40){
  if(!p.length)return Array(n).fill(12);
  const out=[];
  for(let i=0;i<n;i++){
    const a=Math.floor(i*p.length/n),b=Math.max(a+1,Math.floor((i+1)*p.length/n));
    let mx=0;for(let j=a;j<b&&j<p.length;j++)mx=Math.max(mx,p[j]);
    out.push(mx);
  }
  const top=Math.max(...out,.05);
  return out.map(v=>Math.max(10,Math.round(v/top*100)));
}
async function sendVoice(r,dur){
  const info=audioInfo(r.type);
  const blob=new Blob(r.chunks,{type:info.type});
  if(!blob.size)return toast('Δεν γράφτηκε ήχος. Δοκίμασε ξανά.');
  const path=`${r.conv}/${crypto.randomUUID()}.${info.ext}`;
  try{
    const up=await sb.storage.from('voice-notes').upload(path,blob,{contentType:info.type,upsert:false});
    if(up.error)throw up.error;
    const row={conversation_id:r.conv,sender_id:state.me.id,content:path,kind:'voice',meta:{d:Math.round(dur),w:wavePeaks(r.peaks)}};
    if(r.reply&&r.reply.conversation_id===r.conv)row.reply_to=r.reply.id;
    const {data,error}=await sb.from('messages').insert(row).select(MSG_COLS).single();
    if(error){sb.storage.from('voice-notes').remove([path]);throw error;}
    // my own note plays straight from memory
    voiceSrc.set(path,{url:URL.createObjectURL(blob),exp:Infinity});
    if(r.reply&&state.replyTo?.id===r.reply.id)cancelReply();
    if(state.activeId===r.conv)appendMessage(data);
    bumpConv(data);
  }catch(e){console.warn(e);toast('Το φωνητικό δεν στάλθηκε');}
}
(()=>{
  const mic=$('micBtn');let x0=0,downAt=0,pid=null;

/* ================= NIGHT MODE (dark from sunset to sunrise) ================= */
// sunrise / sunset for a date and place (same maths as the SunCalc library)
function sunTimes(date,lat,lng){
  const rad=Math.PI/180,dayMs=864e5,J1970=2440588,J2000=2451545,J0=0.0009,e=rad*23.4397;
  const d=date/dayMs-0.5+J1970-J2000,lw=-lng*rad,phi=lat*rad;
  const n=Math.round(d-J0-lw/(2*Math.PI));
  const ds=J0+lw/(2*Math.PI)+n;
  const M=rad*(357.5291+0.98560028*ds);
  const L=M+rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+rad*102.9372+Math.PI;
  const dec=Math.asin(Math.sin(e)*Math.sin(L));
  const Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-0.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  if(isNaN(w))return null; // polar day / night
  const Jset=J2000+(J0+(w+lw)/(2*Math.PI)+n)+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  const fromJ=j=>new Date((j+0.5-J1970)*dayMs);
  return {rise:fromJ(Jnoon-(Jset-Jnoon)),set:fromJ(Jset)};
}
// rough location from the phone's time zone (no location permission needed)
function approxPlace(){
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch{}
  const known={'Europe/Athens':[37.98,23.73],'Asia/Nicosia':[35.17,33.36],'Europe/London':[51.5,-0.12],'Europe/Berlin':[52.52,13.4],'Europe/Paris':[48.86,2.35],'Europe/Amsterdam':[52.37,4.9],'Europe/Brussels':[50.85,4.35],'Europe/Rome':[41.9,12.5],'Europe/Madrid':[40.42,-3.7],'America/New_York':[40.71,-74],'America/Los_Angeles':[34.05,-118.24]};
  if(known[tz])return known[tz];
  // standard (non-summer) offset from UTC gives a rough longitude
  const y=new Date().getFullYear();
  const std=Math.min(-new Date(y,0,1).getTimezoneOffset(),-new Date(y,6,1).getTimezoneOffset());
  return [40,std/60*15];
}
function todaySun(){
  const noon=new Date();noon.setHours(12,0,0,0);

  const t=sunTimes(noon,lat,lng);

  const r=new Date(noon),st=new Date(noon);r.setHours(7,0,0,0);st.setHours(20,0,0,0);return {rise:r,set:st};
}

  if(root.classList.contains('night')===on)return;
  root.classList.toggle('night',on);
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{if(!m.dataset.day)m.dataset.day=m.content;m.content=on?'#000000':m.dataset.day;});
  const c=state.me&&activeConv();if(c)applyChatLook(c);
  renderProfile();
}
applyNight();
setInterval(applyNight,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')applyNight();});
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>';
const hhmm=d=>d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});

}

/* ================= FEED (friends only, no likes) ================= */
const POST_COLS='id,author_id,caption,photo_path,photo_w,photo_h,created_at,author:profiles!posts_author_id_fkey(id,username,display_name,avatar_url,bio)';
const FEED_PAGE=15,CAPTION_MAX=2200;
// the feed has two sections: photos and texts, each loaded on its own
const newList=()=>({posts:[],loaded:false,loading:false,more:true,fresh:0,at:0,top:0});
const feed={tab:lsGet('fc-feed-tab')==='texts'?'texts':'photos',L:{photos:newList(),texts:newList()},newest:null};
const feedList=(t=feed.tab)=>feed.L[t];
function resetFeed(){feed.L={photos:newList(),texts:newList()};feed.newest=null;}
const ICON_SEND_DM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>';
const ICON_DOTS='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

// "πριν από 3 ώρες"
function relLong(d){
  const s=Math.max(0,(Date.now()-new Date(d))/1000);
  if(s<60)return 'μόλις τώρα';
  const m=Math.floor(s/60);if(m<60)return `πριν από ${m} ${m===1?'λεπτό':'λεπτά'}`;
  const h=Math.floor(m/60);if(h<24)return `πριν από ${h} ${h===1?'ώρα':'ώρες'}`;
  const dd=Math.floor(h/24);if(dd<7)return `πριν από ${dd} ${dd===1?'μέρα':'μέρες'}`;
  return new Date(d).toLocaleDateString('el-GR',{day:'numeric',month:'long',year:new Date(d).getFullYear()===new Date().getFullYear()?undefined:'numeric'});
}

// signed links for post photos (the bucket is private: friends only)
const postSrc=new Map();
const postUrl=path=>{const h=postSrc.get(path);return h&&h.exp>Date.now()?h.url:null;};
async function postUrls(paths){
  const need=[...new Set(paths.filter(p=>p&&!postUrl(p)))];
  if(!need.length)return;
  const {data}=await sb.storage.from('posts').createSignedUrls(need,6*3600);
  (data||[]).forEach(d=>{if(d&&d.signedUrl&&d.path)postSrc.set(d.path,{url:d.signedUrl,exp:Date.now()+5*3600e3});});
}

/* ---- the feed list ---- */
function showFeed(){
  markFeedSeen();syncFeedTabs();
  const L=feedList();
  if(!L.loaded||L.fresh||Date.now()-L.at>60e3)loadFeed(true);
  else renderFeed();
}
async function loadFeed(reset=false,t=feed.tab){
  const L=feed.L[t];
  if(L.loading||!state.me)return;
  if(!reset&&!L.more)return;
  L.loading=true;
  let q=sb.from('posts').select(POST_COLS);
  q=t==='photos'?q.not('photo_path','is',null):q.is('photo_path',null);
  q=q.order('created_at',{ascending:false}).limit(FEED_PAGE);
  if(!reset&&L.posts.length)q=q.lt('created_at',L.posts[L.posts.length-1].created_at);
  const {data,error}=await q;
  if(error){L.loading=false;if(!L.loaded){L.loaded=true;renderFeed();}return toast('Δεν φόρτωσε η ροή');}
  const rows=data||[];
  await postUrls(rows.map(p=>p.photo_path));
  if(feed.L[t]!==L)return; // logged out meanwhile
  L.loading=false;
  L.posts=reset?rows:L.posts.concat(rows.filter(r=>!L.posts.some(x=>x.id===r.id)));
  L.more=rows.length===FEED_PAGE;L.loaded=true;L.at=Date.now();
  if(reset){L.fresh=0;const f=rows.find(p=>p.author_id!==state.me.id);if(f&&(!feed.newest||f.created_at>feed.newest))feed.newest=f.created_at;}
  if(state.view==='feed')markFeedSeen();
  if(t===feed.tab)renderFeed();else syncFeedTabs();
}
// tabs under the "Ροή" title
function syncFeedTabs(){
  document.querySelectorAll('#feedTabs [data-ftab]').forEach(b=>{
    const t=b.dataset.ftab,on=t===feed.tab;
    b.classList.toggle('on',on);b.setAttribute('aria-selected',on);
    b.classList.toggle('has-new',!on&&feed.L[t].fresh>0);
  });
}
document.querySelectorAll('#feedTabs [data-ftab]').forEach(b=>b.onclick=()=>{
  const t=b.dataset.ftab,list=$('feedList');
  if(t===feed.tab){list.scrollTo({top:0,behavior:'smooth'});return;}
  feedList().top=list.scrollTop;
  feed.tab=t;lsSet('fc-feed-tab',t);syncFeedTabs();
  const L=feedList();
  if(!L.loaded||L.fresh||Date.now()-L.at>60e3){L.top=0;renderFeed();loadFeed(true);}
  else{renderFeed();list.scrollTop=L.top;}
});
function postHTML(p){
  const mine=p.author_id===state.me.id,a=mine?state.me:p.author;
  const cap=p.caption||'';
  const long=cap.length>180||cap.split('\n').length>3;
  let body;
  if(p.photo_path){
    const url=postUrl(p.photo_path);
    const ratio=p.photo_w&&p.photo_h?Math.min(1.91,Math.max(.8,p.photo_w/p.photo_h)):1;
    body=`<div class="post-media" style="aspect-ratio:${ratio.toFixed(4)}">${url?`<img src="${esc(url)}" alt="" loading="lazy" onload="this.classList.add('ok')">`:''}</div>`+
      (cap?`<div class="post-cap${long?' clamp':''}"><b>${esc(a?.username||'')}</b>${linkify(cap)}</div>`:'');
  }else body=`<div class="post-text${long?' clamp':''}">${linkify(cap)}</div>`;
  return `<article class="post" data-pid="${p.id}">
    <div class="post-head"><button class="ph" data-user="${p.author_id}">${avP(a,'sm')}<span class="n"><b>${esc(a?.username||'')}</b><span>${esc(relLong(p.created_at))}</span></span></button>
      ${mine?`<button class="icon-btn" data-del="${p.id}" aria-label="Διαγραφή δημοσίευσης">${ICON_DOTS}</button>`
            :`<button class="icon-btn" data-dm="${p.author_id}" aria-label="Στείλε μήνυμα στον/στην ${esc(a?.username||'')}">${ICON_SEND_DM}</button>`}</div>
    ${body}${long?`<button class="more-btn" data-expand>περισσότερα</button>`:''}</article>`;
}
function renderFeed(){
  const list=$('feedList'),L=feedList(),photos=feed.tab==='photos';
  if(!state.me)return;
  syncFeedTabs();
  if(!L.loaded){list.innerHTML='<div class="empty">Φόρτωση…</div>';list.scrollTop=0;return;}
  let h=L.fresh?`<button class="new-pill" id="freshBtn">↑ Νέες δημοσιεύσεις</button>`:'';
  if(!L.posts.length){
    h+=`<div class="empty"><b>${photos?'Καμία φωτογραφία ακόμα':'Κανένα κείμενο ακόμα'}</b>${state.friends.length?(photos?'Εδώ θα βλέπεις τις φωτογραφίες που ανεβάζουν οι φίλοι σου.':'Εδώ θα βλέπεις ό,τι γράφουν οι φίλοι σου.'):'Πρόσθεσε φίλους για να βλέπεις τι ανεβάζουν.'}
      <br><button class="btn btn-primary btn-sm" id="firstPost" style="margin-top:14px">${photos?'Ανέβασε φωτογραφία':'Γράψε κάτι'}</button></div>`;
  }else{
    h+=L.posts.map(postHTML).join('');
    h+=L.more?`<div class="empty" style="padding:18px">Φόρτωση…</div>`:`<div class="empty" style="padding:22px 24px 30px">Αυτά για τώρα ✨</div>`;
  }
  const keep=list.scrollTop;list.innerHTML=h;list.scrollTop=keep;
  const fb=$('freshBtn');if(fb)fb.onclick=()=>{list.scrollTo({top:0});loadFeed(true);};
  const fp=$('firstPost');if(fp)fp.onclick=()=>openNewPost(photos);
}
$('feedList').addEventListener('scroll',e=>{
  const l=e.target,L=feedList();
  if(L.more&&!L.loading&&l.scrollHeight-l.scrollTop-l.clientHeight<600)loadFeed(false);
},{passive:true});
$('newPostBtn').onclick=()=>openNewPost(feed.tab==='photos');

// taps inside a post (feed, or a post opened from a profile grid)
function onPostClick(e){
  const x=e.target.closest('[data-expand]');
  if(x){x.previousElementSibling?.classList.remove('clamp');x.remove();return;}
  const u=e.target.closest('[data-user]');
  if(u){
    const id=u.dataset.user;
    if(id===state.me.id){closeSheet();return setView('profile');}
    const p=findPost(+u.closest('[data-pid]').dataset.pid);
    return openUser(state.friends.find(f=>f.id===id)||p?.author);
  }
  const dm=e.target.closest('[data-dm]');
  if(dm){closeSheet();setView('messages');return startDirect(dm.dataset.dm);}
  const del=e.target.closest('[data-del]');
  if(del)return deletePost(+del.dataset.del);
}
$('feedList').addEventListener('click',onPostClick);
function findPost(id){return feed.L.photos.posts.find(p=>p.id===id)||feed.L.texts.posts.find(p=>p.id===id)||(state.myPosts||[]).find(p=>p.id===id)||openPostCache.get(id);}

async function deletePost(id){
  const p=findPost(id);if(!p)return;
  if(!confirm('Διαγραφή δημοσίευσης;\nΘα φύγει από τη ροή όλων των φίλων σου.'))return;
  const {error}=await sb.from('posts').delete().eq('id',id);
  if(error)return toast('Δεν διαγράφηκε');
  if(p.photo_path)sb.storage.from('posts').remove([p.photo_path]);
  closeSheet();dropPost(id);toast('Η δημοσίευση διαγράφηκε');
}
function dropPost(id){
  const b=(state.myPosts||[]).length;let hit=false;
  for(const L of Object.values(feed.L)){const n=L.posts.length;L.posts=L.posts.filter(p=>p.id!==id);if(L.posts.length!==n)hit=true;}
  if(state.myPosts)state.myPosts=state.myPosts.filter(p=>p.id!==id);
  if(hit)renderFeed();
  if((state.myPosts||[]).length!==b)renderProfile();
}

/* ---- "new posts" dot on the Ροή tab ---- */
function updateFeedDot(){
  const seen=lsGet('fc-feed-seen');
  const show=!!feed.newest&&state.view!=='feed'&&(!seen||feed.newest>seen);
  $('feedDot').classList.toggle('hidden',!show);
}
function markFeedSeen(){lsSet('fc-feed-seen',new Date().toISOString());updateFeedDot();}
async function checkFeedDot(){
  const {data}=await sb.from('posts').select('created_at').neq('author_id',state.me.id).order('created_at',{ascending:false}).limit(1);
  if(data&&data[0])feed.newest=data[0].created_at;
  updateFeedDot();
}
function onNewPost(p){
  if(!state.me||p.author_id===state.me.id)return;
  const t=p.photo_path?'photos':'texts';
  feed.newest=p.created_at;feed.L[t].fresh++;
  if(state.view==='feed'){
    markFeedSeen();
    if(t===feed.tab&&$('feedList').scrollTop<40&&!$('overlay'))loadFeed(true);
    else if(t===feed.tab)renderFeed();else syncFeedTabs();
  }else updateFeedDot();
}

/* ---- profile grids ---- */
async function loadMyPosts(){
  state.myPostsLoading=true;
  const {data,error}=await sb.from('posts').select(POST_COLS).eq('author_id',state.me.id).order('created_at',{ascending:false}).limit(90);
  state.myPostsLoading=false;
  if(error){state.myPosts=[];renderProfile();return;}
  await postUrls((data||[]).map(p=>p.photo_path));
  state.myPosts=data||[];renderProfile();
}
async function loadUserPosts(uid){
  const {data}=await sb.from('posts').select(POST_COLS).eq('author_id',uid).order('created_at',{ascending:false}).limit(90);
  await postUrls((data||[]).map(p=>p.photo_path));
  return data||[];
}
function gridHTML(posts){
  return `<div class="grid">${posts.map(p=>{
    if(p.photo_path){const u=postUrl(p.photo_path);return `<button class="tile" data-post="${p.id}" aria-label="Δημοσίευση"${u?` style="background-image:url(&quot;${esc(u)}&quot;)"`:''}></button>`;}
    return `<button class="tile txt" data-post="${p.id}"><span>${esc(p.caption)}</span></button>`;
  }).join('')}</div>`;
}
const ICON_GRID='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>';
const ICON_TEXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg>';
// profile: two sections, photos (grid) and texts (list)
function postsSectionHTML(posts,tab,mine){
  const photos=posts.filter(p=>p.photo_path),texts=posts.filter(p=>!p.photo_path);
  let h=`<div class="ptabs" role="tablist">
    <button role="tab" data-ptab="photos" class="${tab==='photos'?'on':''}" aria-selected="${tab==='photos'}">${ICON_GRID}<span>Φωτογραφίες</span><i>${photos.length}</i></button>
    <button role="tab" data-ptab="texts" class="${tab==='texts'?'on':''}" aria-selected="${tab==='texts'}">${ICON_TEXT}<span>Κείμενα</span><i>${texts.length}</i></button></div>`;
  if(tab==='photos')h+=photos.length?gridHTML(photos)
    :`<div class="grid-empty">${mine?'<b>Καμία φωτογραφία ακόμα</b>Ό,τι ανεβάζεις το βλέπουν μόνο οι φίλοι σου.':'Δεν έχει ανεβάσει φωτογραφίες ακόμα.'}</div>`;
  else h+=texts.length?`<div class="tlist">${texts.map(p=>`<button class="tcard" data-post="${p.id}"><span class="tt">${esc(p.caption)}</span><span class="tw">${esc(relLong(p.created_at))}</span></button>`).join('')}</div>`
    :`<div class="grid-empty">${mine?'<b>Κανένα κείμενο ακόμα</b>Γράψε κάτι που σου αρέσει: μια σκέψη, ένα τραγούδι, ένα βιβλίο.':'Δεν έχει ανεβάσει κείμενα ακόμα.'}</div>`;
  return h;
}
function wireSection(root,posts,setTab){
  if(!root)return;
  root.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{if(!b.classList.contains('on'))setTab(b.dataset.ptab);});
  wireGrid(root,posts);
}
function wireGrid(root,posts){
  if(!root)return;
  root.querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>{const p=posts.find(x=>x.id===+b.dataset.post);if(p)openPost(p);});
}
const openPostCache=new Map();
function openPost(p){
  openPostCache.set(p.id,p);
  openSheet('Δημοσίευση',`<div id="onePost">${postHTML(p)}</div>`);
  $('onePost').addEventListener('click',onPostClick);
}

/* ---- new post ---- */
function imgSize(blob){
  return new Promise(res=>{const u=URL.createObjectURL(blob),i=new Image();
    i.onload=()=>{res({w:i.naturalWidth,h:i.naturalHeight});URL.revokeObjectURL(u);};
    i.onerror=()=>{res({w:null,h:null});URL.revokeObjectURL(u);};i.src=u;});
}
function openNewPost(withPhoto=false){
  let file=null,preview=null;
  openSheet('Νέα δημοσίευση',`<div class="np">
      <button class="np-pick" id="npPick">${ICON_IMG}<span>Πρόσθεσε φωτογραφία</span></button>
      <div class="np-prev hidden" id="npPrev"><img id="npImg" alt=""><button class="np-x" id="npX" aria-label="Αφαίρεση φωτογραφίας">${ICON_X}</button></div>
      <input type="file" id="npFile" accept="image/*" hidden>
      <textarea class="inp" id="npCap" rows="4" maxlength="${CAPTION_MAX}" placeholder="Γράψε κάτι που σου αρέσει…"></textarea>
      <div class="hint"><span>${ICON_LOCK.replace('<svg ','<svg style="width:13px;height:13px;display:inline-block;vertical-align:-2px;margin-right:4px" ')}Τη βλέπουν μόνο οι φίλοι σου</span><span id="npCount"></span></div>
    </div>`,
    `<button class="btn btn-primary" id="npShare" style="width:100%" disabled>Κοινοποίηση</button>`);
  const cap=$('npCap');
  const upd=()=>{
    $('npShare').disabled=!file&&!cap.value.trim();
    const n=cap.value.length;$('npCount').textContent=n>CAPTION_MAX-200?`${n}/${CAPTION_MAX}`:'';
  };
  const clearPic=()=>{file=null;if(preview)URL.revokeObjectURL(preview);preview=null;$('npPrev').classList.add('hidden');$('npPick').classList.remove('hidden');upd();};
  cap.addEventListener('input',upd);
  $('npPick').onclick=()=>$('npFile').click();
  $('npX').onclick=clearPic;
  $('npFile').onchange=e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    if(!f.type.startsWith('image/'))return toast('Διάλεξε μια εικόνα');
    if(preview)URL.revokeObjectURL(preview);
    file=f;preview=URL.createObjectURL(f);$('npImg').src=preview;
    $('npPrev').classList.remove('hidden');$('npPick').classList.add('hidden');upd();
  };
  const close0=$('closeSheet').onclick;
  $('closeSheet').onclick=()=>{if(preview)URL.revokeObjectURL(preview);close0();};
  $('npShare').onclick=async()=>{
    const btn=$('npShare'),caption=cap.value.trim();
    if(!file&&!caption)return;
    btn.disabled=true;btn.textContent='Κοινοποίηση…';
    let path=null;
    try{
      const row={caption};
      if(file){
        const blob=await shrinkImage(file,1440);
        const {w,h}=await imgSize(blob);
        path=`${state.me.id}/${crypto.randomUUID()}.jpg`;
        const up=await sb.storage.from('posts').upload(path,blob,{contentType:'image/jpeg',upsert:false});
        if(up.error)throw up.error;
        Object.assign(row,{photo_path:path,photo_w:w,photo_h:h});
        postSrc.set(path,{url:URL.createObjectURL(blob),exp:Infinity}); // show it straight away
      }
      const {data,error}=await sb.from('posts').insert(row).select(POST_COLS).single();
      if(error)throw error;
      if(preview)URL.revokeObjectURL(preview);
      closeSheet();
      const t=data.photo_path?'photos':'texts';
      feed.L[t].posts.unshift(data);if(state.myPosts)state.myPosts.unshift(data);
      if(feed.tab!==t){feed.tab=t;lsSet('fc-feed-tab',t);syncFeedTabs();}
      if(state.view==='profile')renderProfile();else setView('feed');
      renderFeed();$('feedList').scrollTop=0;
      toast('Δημοσιεύτηκε');
    }catch(err){
      console.warn(err);
      if(path)sb.storage.from('posts').remove([path]);
      btn.disabled=false;btn.textContent='Κοινοποίηση';toast('Δεν δημοσιεύτηκε. Δοκίμασε ξανά.');
    }
  };
  if(withPhoto===true)$('npFile').click();else cap.focus();
}
syncComposer();
